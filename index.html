<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F6BFF">
<title>Lifts</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface2:#E8ECF3; --ink:#1A1F2B; --muted:#687085; --line:#DDE2EA;
  --accent:#2F6BFF; --accent-ink:#FFFFFF; --accent-soft:#E5EDFF; --danger:#E5484D; --success:#16A271;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1218; --surface:#181C24; --surface2:#232A36; --ink:#E9ECF2; --muted:#9AA3B5; --line:#2A3140;
    --accent:#5B8CFF; --accent-ink:#0B1020; --accent-soft:#1D2A4C; --danger:#FF6B6E; --success:#36CC93;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1218; --surface:#181C24; --surface2:#232A36; --ink:#E9ECF2; --muted:#9AA3B5; --line:#2A3140;
  --accent:#5B8CFF; --accent-ink:#0B1020; --accent-soft:#1D2A4C; --danger:#FF6B6E; --success:#36CC93;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 150px}
h1{font-family:var(--cond);font-weight:700;font-size:2.3rem;line-height:1;margin:8px 0 16px}
h2{font-family:var(--cond);font-weight:600;font-size:1.35rem;line-height:1.1;margin:0}
h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 8px;font-weight:600}
.sub{color:var(--muted);font-size:.9rem}
.row{display:flex;gap:8px;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{border:0;border-radius:12px;padding:11px 16px;background:var(--surface2);font-weight:600;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.wide{width:100%}
.btn.sm{padding:6px 12px;min-height:36px;font-size:.9rem}
.btn:disabled{opacity:.45}
.icon{border:0;background:transparent;min-width:40px;min-height:40px;border-radius:8px;font-size:1.05rem;color:var(--muted)}
.icon:active{background:var(--surface2)}
.icon:disabled{opacity:.3}
.stack>*+*{margin-top:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.plan .names{color:var(--muted);font-size:.92rem;margin:4px 0 12px}
.plan.tpl{background:transparent;border-style:dashed}
.banner{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.banner .btn{background:var(--accent-ink);color:var(--accent)}
.empty{border:2px dashed var(--line);border-radius:16px;padding:22px;text-align:center;color:var(--muted)}
label.f,.f{display:block;font-size:.85rem;color:var(--muted)}
input.t,textarea.t,select.t{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
textarea.t{min-height:70px;resize:vertical}
.name-in{font-family:var(--cond);font-size:1.6rem;font-weight:600;border:0;border-bottom:2px solid var(--line);background:transparent;width:100%;padding:4px 0;border-radius:0}
.name-in:focus{outline:none;border-bottom-color:var(--accent)}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.item .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.item .grid input{width:100%;text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 4px;min-height:42px}
.exname{font-weight:600;line-height:1.25}
.exname small{display:block;font-weight:400;color:var(--muted);font-size:.85rem}
/* workout */
.clock{font-family:var(--cond);font-weight:700;font-size:3.6rem;line-height:.9;font-variant-numeric:tabular-nums}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.ex-h{padding:12px 8px 6px 14px;display:flex;justify-content:space-between;gap:6px}
.ex .ex-h .exname{color:var(--accent);font-size:1.05rem}
.target{color:var(--muted);font-size:.85rem;padding:0 14px 8px}
.sets{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.sets th{font-size:.72rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;text-align:center;padding:4px 2px}
.sets td{text-align:center;padding:5px 3px}
.sets td.n{font-weight:700;width:40px}
.sets td.prev{color:var(--muted);font-size:.85rem;width:24%}
.sets input{width:100%;max-width:84px;text-align:center;background:var(--surface2);border:1px solid transparent;border-radius:8px;padding:8px 2px;min-height:40px;font-size:1.05rem;font-weight:600}
.sets input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.sets input::placeholder{color:var(--muted);opacity:.7;font-weight:500}
.chk{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:transparent;font-size:1rem;color:transparent;font-weight:700}
tr.done td{background:var(--accent-soft)}
tr.done input{background:transparent}
tr.done .chk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ex-f{display:flex;gap:8px;padding:8px 12px 12px}
.rest{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--accent);color:var(--accent-ink);padding:10px 16px;display:flex;align-items:center;gap:10px;overflow:hidden}
.rest .bar{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.18);pointer-events:none}
.rest .time{font-family:var(--cond);font-weight:700;font-size:2rem;font-variant-numeric:tabular-nums;position:relative;flex:1}
.rest button{position:relative;background:rgba(255,255,255,.2);border:0;color:inherit;border-radius:8px;min-height:40px;padding:0 12px;font-weight:600}
.badge{display:inline-block;background:var(--success);color:#fff;font-size:.68rem;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle;letter-spacing:.03em}
/* history */
.hist{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stats{display:flex;gap:16px;color:var(--muted);font-size:.88rem;margin-top:4px;flex-wrap:wrap}
.month{font-family:var(--cond);font-weight:600;color:var(--muted);font-size:1.05rem;margin:18px 0 8px}
.setline{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.95rem}
/* progress */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile b{display:block;font-family:var(--cond);font-size:1.8rem;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:.85rem}
.chart{width:100%;height:auto;display:block}
.c-grid{stroke:var(--line);stroke-width:1}
.c-line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.c-area{fill:var(--accent-soft)}
.c-dot{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.c-bar{fill:var(--accent)}
.c-bar.dim{fill:var(--accent-soft)}
.c-txt{fill:var(--muted);font-size:10px;font-family:var(--body)}
.hb{display:grid;grid-template-columns:110px 1fr 34px;gap:8px;align-items:center;font-size:.9rem;margin:6px 0}
.hb .track{background:var(--surface2);border-radius:5px;height:10px;overflow:hidden}
.hb .fill{background:var(--accent);height:100%;border-radius:5px}
.prrow{display:flex;width:100%;text-align:left;justify-content:space-between;align-items:center;gap:10px;background:transparent;border:0;border-bottom:1px solid var(--line);padding:11px 2px}
.prrow:last-child{border-bottom:0}
.prrow .val{font-size:.88rem;color:var(--muted)}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{flex:1;border:0;background:transparent;height:64px;font-weight:600;color:var(--muted);position:relative;font-size:.85rem;padding:0 2px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:20%;right:20%;height:3px;background:var(--accent);border-radius:0 0 3px 3px}
nav.tabs .live::after{content:"";position:absolute;top:14px;right:calc(50% - 34px);width:8px;height:8px;border-radius:50%;background:var(--success)}
/* sheet */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-h{padding:12px 16px 8px;max-width:640px;width:100%;margin:0 auto}
.sheet-b{flex:1;overflow-y:auto;padding:0 16px 16px;max-width:640px;width:100%;margin:0 auto}
.sheet-f{padding:10px 16px 14px;border-top:1px solid var(--line);background:var(--surface);max-width:640px;width:100%;margin:0 auto}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pick{display:flex;width:100%;text-align:left;justify-content:space-between;align-items:center;gap:10px;background:transparent;border:0;border-bottom:1px solid var(--line);padding:11px 4px;min-height:56px}
.pick .mark{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:700}
.pick[aria-pressed="true"] .mark{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.grp{font-family:var(--cond);font-weight:600;color:var(--muted);margin:16px 0 2px;font-size:1.05rem}
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,14,20,.5);display:grid;place-items:center;padding:20px}
.modal .box{background:var(--surface);border-radius:16px;padding:18px;max-width:420px;width:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.95rem;max-width:90vw}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1 1 auto;border:0;background:transparent;padding:9px 8px;min-height:42px;font-weight:600;color:var(--muted);font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.hr{height:1px;background:var(--line);margin:18px 0}
@media (prefers-reduced-motion:no-preference){ .chk,.btn,tr td{transition:background-color .15s} }
</style>
</head>
<body>

  <button data-tab="settings">Settings</button>
</nav>
<div id="layer"></div>

/* ---------- storage ---------- */
const KEY = "lifts.v1";
const defaults = () => ({v:2, plans:[], custom:[], history:[], active:null, settings:{lang:"en", alt:"pl", rest:90, sound:true, wake:true, templates:true}});
function hydrate(d){
  const base = defaults(), s = Object.assign(base.settings, d.settings||{});
  if(!d.settings || d.settings.alt===undefined) s.alt = s.lang==="en" ? "pl" : "en";
  const out = Object.assign(base, d, {settings:s});
  out.history.sort((a,b)=>a.start-b.start);
  return out;
}
function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw) return hydrate(JSON.parse(raw)); }catch(e){}
  return defaults();
}
let S = load();
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast("Could not save on this device. Export a backup in Settings."); }
}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s||"").toLowerCase().replace(/ł/g,"l").normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const num = v => { if(v==null || v==="") return null; const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : null; };
const locale = () => (LANGS[S.settings.lang]||LANGS.en)[1];
const fmtNum = (n, d=1) => Number(n).toLocaleString(locale(), {maximumFractionDigits:d});
const fmtKg = n => n==null || n==="" ? "" : fmtNum(n, 2);
const fmtVol = v => v >= 10000 ? fmtNum(v/1000, 1) + " t" : fmtNum(v, 0) + " kg";
function parseTime(v){
  if(v==null || v==="") return null;
  const s = String(v).trim();
  if(s.includes(":")){ const [m,sec] = s.split(":"); const r = (parseInt(m)||0)*60 + (parseInt(sec)||0); return r||null; }
  const n = parseInt(s); return isFinite(n) && n>0 ? n : null;
}
const fmtTime = s => { if(s==null || s==="") return ""; s=Math.max(0,Math.round(s)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h? h+":"+String(m).padStart(2,"0") : m) + ":" + String(x).padStart(2,"0"); };
const fmtDate = ts => new Date(ts).toLocaleDateString(locale(), {weekday:"short", day:"numeric", month:"short"});
const fmtDateY = ts => new Date(ts).toLocaleDateString(locale(), {day:"numeric", month:"short", year:"numeric"});
const fmtShort = ts => new Date(ts).toLocaleDateString(locale(), {day:"numeric", month:"numeric"});
const fmtMonth = ts => new Date(ts).toLocaleDateString(locale(), {month:"long", year:"numeric"});
const fmtDur = ms => { const m = Math.max(0, Math.round(ms/60000)); return m<60 ? m+" min" : Math.floor(m/60)+" h "+(m%60)+" min"; };
const pad2 = n => String(n).padStart(2,"0");
const toLocalInput = ts => { const d = new Date(ts); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
const fromLocalInput = v => { if(!v) return null; const t = new Date(v).getTime(); return isFinite(t) ? t : null; };

}

const getEx = id => EXMAP[id] || {id, en:"Removed exercise", pl:"Usunięte ćwiczenie", cs:"Odstraněný cvik", sk:"Odstránený cvik", cat:"cardio", type:"w"};
const exMain = e => e[S.settings.lang] || e.en;

const exLabel = e => `<div class="exname">${esc(exMain(e))}${exAlt(e) ? `<small>${esc(exAlt(e))}</small>` : ""}</div>`;

function lastSets(exId){
  for(let i=S.history.length-1; i>=0; i--){
    const e = S.history[i].exercises.find(x => x.exId===exId);
    if(e && e.sets.length) return e.sets;
  }
  return null;
}
function setText(s, type){
  if(type==="t") return fmtTime(s.t) || "–";
  if(type==="bw") return (s.kg ? "+"+fmtKg(s.kg)+" kg × " : "") + (s.reps??"–") + (s.kg ? "" : " reps");
  return (s.kg!=null ? fmtKg(s.kg)+" kg" : "– kg") + " × " + (s.reps ?? "–");
}
function vol(w){ return w.exercises.reduce((a,e)=> a + e.sets.reduce((b,s)=> b + ((s.kg||0)*(s.reps||0)),0),0); }

/* ---------- records ---------- */
const e1rm = s => (s.kg>0 && s.reps>0) ? (s.reps===1 ? s.kg : s.kg*(1+s.reps/30)) : 0;
function bestOf(type, sets){
  const r = {kg:0, e1rm:0, vol:0, setVol:0, reps:0, t:0, top:null};
  sets.forEach(s => {
    const kg=s.kg||0, reps=s.reps||0, t=s.t||0;
    if(type==="t"){ if(t>r.t){ r.t=t; r.top=s; } return; }
    if(type==="bw"){
      if(reps>r.reps || (reps===r.reps && r.top && kg>(r.top.kg||0))){ r.reps=reps; r.top=s; }
      if(kg>r.kg) r.kg=kg; r.vol += kg*reps; return;
    }
    if(!r.top || kg>r.kg || (kg===r.kg && reps>(r.top.reps||0))){ r.kg=kg; r.top=s; }
    const e=e1rm(s); if(e>r.e1rm) r.e1rm=e;
    r.vol += kg*reps; if(kg*reps>r.setVol) r.setVol=kg*reps;
  });
  return r;
}
function sessions(exId){
  const type = getEx(exId).type, out = [];
  S.history.forEach(w => {
    const sets = w.exercises.filter(x=>x.exId===exId).flatMap(x=>x.sets);
    if(sets.length) out.push({w, start:w.start, sets, b:bestOf(type, sets)});
  });
  return out;
}
function records(exId){
  const ss = sessions(exId); if(!ss.length) return null;
  const type = getEx(exId).type, best = {}, when = {};
  const keys = type==="w" ? ["kg","e1rm","setVol","vol"] : type==="bw" ? ["reps","kg"] : ["t"];
  ss.forEach(s => keys.forEach(k => { if((s.b[k]||0) > (best[k]||0)){ best[k]=s.b[k]; when[k]=s.start; } }));
  return {type, best, when, last:ss[ss.length-1].start, n:ss.length, ss};
}
function workoutPRs(w){
  const marks = new Set(), list = [];
  w.exercises.forEach((x, xi) => {
    const type = getEx(x.exId).type;
    const prev = S.history.filter(h => h.start < w.start && h.id!==w.id).flatMap(h => h.exercises.filter(y=>y.exId===x.exId).flatMap(y=>y.sets));
    if(!prev.length) return;
    const pb = bestOf(type, prev); let got = null;
    x.sets.forEach((s, si) => {
      let pr;
      if(type==="t") pr = (s.t||0) > pb.t;
      else if(type==="bw") pr = (s.reps||0) > pb.reps;
      else pr = (s.kg||0) > pb.kg || e1rm(s) > pb.e1rm + 0.01;
      if(pr){ marks.add(xi+"-"+si); got = s; }
      pb.t = Math.max(pb.t, s.t||0); pb.reps = Math.max(pb.reps, s.reps||0); pb.kg = Math.max(pb.kg, s.kg||0); pb.e1rm = Math.max(pb.e1rm, e1rm(s));
    });
    if(got) list.push({exId:x.exId, s:got, type});
  });
  return {marks, list};
}

/* ---------- toast / confirm ---------- */
let toastT;
function toast(msg){
  clearTimeout(toastT);
  let el = $("#toast"); if(!el){ el = document.createElement("div"); el.id="toast"; el.className="toast"; el.setAttribute("role","status"); document.body.appendChild(el); }
  el.textContent = msg; el.hidden = false;
  toastT = setTimeout(()=> el.hidden = true, msg.length > 60 ? 4500 : 2600);
}
function ask(msg, ok="OK", danger=false){
  return new Promise(res => {
    const d = document.createElement("div");
    d.className = "modal";
    d.innerHTML = `<div class="box" role="dialog" aria-modal="true"><p style="margin:0 0 16px">${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-r="0">Cancel</button><button class="btn ${danger?"danger":"primary"}" data-r="1">${esc(ok)}</button></div></div>`;
    d.addEventListener("click", ev => { const b = ev.target.closest("[data-r]"); if(b || ev.target===d){ ev.stopPropagation(); d.remove(); res(b ? b.dataset.r==="1" : false); } });
    $("#layer").appendChild(d); d.querySelector('[data-r="1"]').focus();
  });
}

  if(!S.settings.sound) return;
  try{ navigator.vibrate && navigator.vibrate([250,120,250]); }catch(e){}
  try{
    if(!AC) return;
    [0, .25].forEach(off => {

    });
  }catch(e){}
}

function weekStart(ts){ const d = new Date(ts); d.setHours(0,0,0,0); d.setDate(d.getDate() - (d.getDay()+6)%7); return d.getTime(); }
function lineChart(pts, fy){
  if(!pts.length) return `<div class="empty">No data for this yet.</div>`;
  const W=340, H=180, l=46, r=14, t=14, b=26;
  let x0 = pts[0].x, x1 = pts[pts.length-1].x; if(x1===x0){ x0 -= 864e5*3; x1 += 864e5*3; }
  const ys = pts.map(p=>p.y); let y0 = Math.min(...ys), y1 = Math.max(...ys);
  const padY = (y1-y0)*0.15 || Math.max(1, y1*0.1); y0 = Math.max(0, y0-padY); y1 = y1+padY;
  const X = x => l + (x-x0)/(x1-x0)*(W-l-r), Y = y => t + (1-(y-y0)/(y1-y0))*(H-t-b);
  const line = pts.map(p => `${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join(" ");
  let g = "";
  [y0, (y0+y1)/2, y1].forEach(v => g += `<line class="c-grid" x1="${l}" x2="${W-r}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text class="c-txt" x="${l-6}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end">${esc(fy(v))}</text>`);
  g += `<text class="c-txt" x="${l}" y="${H-8}">${esc(fmtShort(pts[0].x))}</text><text class="c-txt" x="${W-r}" y="${H-8}" text-anchor="end">${esc(fmtShort(pts[pts.length-1].x))}</text>`;
  const area = pts.length>1 ? `<polygon class="c-area" points="${X(pts[0].x).toFixed(1)},${H-b} ${line} ${X(pts[pts.length-1].x).toFixed(1)},${H-b}"/>` : "";
  const dots = pts.map(p => `<circle class="c-dot" cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3.5"><title>${esc(fmtDateY(p.x)+": "+fy(p.y))}</title></circle>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Progress chart">${g}${area}${pts.length>1?`<polyline class="c-line" points="${line}"/>`:""}${dots}</svg>`;
}
function barChart(bars, fy){
  const W=340, H=160, l=8, r=8, t=14, b=24, n=bars.length, gap=6;
  const max = Math.max(1, ...bars.map(x=>x.v)), bw = (W-l-r-gap*(n-1))/n;
  let g = `<line class="c-grid" x1="${l}" x2="${W-r}" y1="${H-b}" y2="${H-b}"/>`;
  bars.forEach((x, i) => {
    const hgt = (H-t-b) * x.v / max, X = l + i*(bw+gap);
    g += `<rect class="c-bar ${i===n-1?"":"dim"}" x="${X.toFixed(1)}" y="${(H-b-hgt).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(hgt, x.v?2:0).toFixed(1)}" rx="3"><title>${esc(x.label+": "+fy(x.v)+", "+x.n+" workouts")}</title></rect>`;
    if(i%3===0 || i===n-1) g += `<text class="c-txt" x="${(X+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${esc(x.label)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly volume chart">${g}</svg>`;
}

  } else if(r.type==="bw"){
    h += tile(r.best.reps||0, "most reps in a set", r.when.reps) + tile(r.best.kg ? "+"+fmtKg(r.best.kg)+" kg" : "–", "most added weight", r.when.kg);
  } else h += tile(fmtTime(r.best.t), "longest set", r.when.t);
  h += tile(r.n, "sessions logged", null) + `</div>`;
  const metrics = r.type==="w" ? [["e1rm","Est. 1RM"],["kg","Heaviest"],["vol","Volume"]] : r.type==="bw" ? [["reps","Most reps"]] : [["t","Longest"]];
  const m = metrics.find(x=>x[0]===sub.m) ? sub.m : metrics[0][0];
  const fy = m==="t" ? v=>fmtTime(v) : m==="reps" ? v=>fmtNum(v,0) : m==="vol" ? fmtVol : v=>fmtKg(Math.round(v*2)/2)+" kg";
  h += `<h3>Progress over time</h3><div class="panel">`;
  if(metrics.length>1) h += `<div class="seg" style="margin-bottom:10px">${metrics.map(([k,l])=>`<button data-act="exMetric" data-v="${k}" aria-pressed="${k===m}">${l}</button>`).join("")}</div>`;
  h += lineChart(r.ss.map(s => ({x:s.start, y:s.b[m]||0})).filter(p=>p.y>0), fy);
  if(m==="e1rm") h += `<p class="sub" style="margin:8px 0 0">Estimated 1RM [one-rep max] uses the Epley formula: weight × (1 + reps ÷ 30). It is a guide, not a tested max.</p>`;
  h += `</div><h3>Sessions</h3><div class="panel" style="padding:4px 12px">`;
  [...r.ss].reverse().forEach(s => h += `<button class="prrow" data-act="openHistFrom" data-id="${s.w.id}"><div><strong>${esc(fmtDateY(s.start))}</strong><div class="val">${esc(s.sets.map(x=>setText(x,r.type)).join(", "))}</div></div><span class="sub" style="flex:none">›</span></button>`);
  return h + `</div>`;
}

    <div class="panel stack">

      <div><div class="f" style="margin-bottom:6px">Second name below it</div><div class="seg">${langBtns("alt", st.alt, true)}</div>
      <p class="sub" style="margin:6px 0 0">Search always works in all four languages.</p></div>
      <div><label class="f" for="drest">Default rest between sets (seconds)</label><input id="drest" class="t" inputmode="numeric" data-sel data-bind="rest" value="${st.rest}"></div>
      <label class="spread"><span>Beep and vibrate when rest ends</span><input type="checkbox" data-bind="sound" ${st.sound?"checked":""} style="width:22px;height:22px"></label>
      <label class="spread"><span>Keep screen on during a workout</span><input type="checkbox" data-bind="wake" ${st.wake?"checked":""} style="width:22px;height:22px"></label>
      <label class="spread"><span>Show templates on the Plans screen</span><input type="checkbox" data-bind="templates" ${st.templates?"checked":""} style="width:22px;height:22px"></label>
    </div>
    <div class="panel stack"><h2>Backup</h2><p class="sub" style="margin:0">Your data lives only in this browser. Clearing Chrome's site data removes it, so export a backup now and then.</p>
      <div class="row"><button class="btn primary" style="flex:1" data-act="export">Export backup</button><button class="btn ghost" style="flex:1" data-act="import">Import backup</button></div>
      <input type="file" id="importFile" accept=".json,application/json,text/plain" hidden>

  if(S.custom.length){

/* ---------- picker ---------- */
function openPicker(mode){ picker = {mode, sel:[], q:"", cat:"all", newType:"w", newCat:"chest"}; renderPicker(); }
function renderPicker(keepInput){
  const Lr = $("#layer");
  if(!picker){ Lr.innerHTML = ""; return; }
  if(!keepInput){
    Lr.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="Pick exercises">
      <div class="sheet-h"><div class="spread"><h2>Pick exercises</h2><button class="btn ghost sm" data-act="pickClose">Close</button></div>
        <input id="pq" class="t" type="search" placeholder="Search: English, polski, čeština, slovenčina" autocomplete="off" style="margin-top:10px" value="${esc(picker.q)}">
        <div class="chips" id="pchips"></div></div>
      <div class="sheet-b" id="plist"></div>
      <div class="sheet-f"><button class="btn primary wide" id="padd" data-act="pickAdd"></button></div></div>`;
    $("#pq").addEventListener("input", ev => { picker.q = ev.target.value; renderPicker(true); });
  }
  $("#pchips").innerHTML = [["all","All"]].concat(Object.keys(CATS).map(c=>[c,catName(c)]))
    .map(([c,n]) => `<button class="chip" data-act="pickCat" data-v="${c}" aria-pressed="${picker.cat===c}">${esc(n)}</button>`).join("");
  const toks = norm(picker.q).split(/\s+/).filter(Boolean);
  const list = allEx().filter(e => (picker.cat==="all" || e.cat===picker.cat) && toks.every(t => norm([e.en,e.pl,e.cs,e.sk,e.extra].join(" ")).includes(t)));
  list.sort((a,b) => exMain(a).localeCompare(exMain(b), locale()));
  const row = e => `<button class="pick" data-act="pickToggle" data-id="${e.id}" aria-pressed="${picker.sel.includes(e.id)}">${exLabel(e)}<span class="mark">${picker.sel.includes(e.id) ? picker.sel.indexOf(e.id)+1 : ""}</span></button>`;
  let h = "";
  if(!toks.length && picker.cat==="all"){
    Object.keys(CATS).forEach(c => { const g = list.filter(e=>e.cat===c); if(g.length) h += `<div class="grp">${esc(catName(c))}</div>` + g.map(row).join(""); });
  } else h += list.map(row).join("");
  if(toks.length){
    h += `<div class="panel stack" style="margin-top:16px"><div>Not on the list? Create <strong>${esc(picker.q.trim())}</strong> as your own exercise.</div>
      <div class="row"><select class="t" id="ntype">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${picker.newType===k?"selected":""}>${v}</option>`).join("")}</select>
      <select class="t" id="ncat">${Object.keys(CATS).map(c=>`<option value="${c}" ${picker.newCat===c?"selected":""}>${esc(catName(c))}</option>`).join("")}</select></div>
      <button class="btn wide" data-act="pickCreate">Create and select</button></div>`;
  } else if(!list.length) h += `<div class="empty" style="margin-top:16px">Nothing here.</div>`;
  $("#plist").innerHTML = h;
  const n = picker.sel.length;
  $("#padd").textContent = n ? `Add ${n} exercise${n>1?"s":""}` : "Select exercises";
  $("#padd").disabled = !n;
  if(!keepInput) setTimeout(()=> $("#pq") && $("#pq").focus(), 50);
}

/* ---------- workout helpers ---------- */
function blankSets(n){ return Array.from({length:Math.max(1,n||3)}, () => ({kg:"", reps:"", t:"", done:false})); }
function startWorkout(plan){
  if(S.active){ toast("Finish or discard the current workout first."); view="workout"; sub=null; render(); return; }
  S.active = {id:uid(), planId:plan?plan.id:null, name:plan?(plan.name||"Workout"):"Workout", note:plan?plan.note||"":"", start:Date.now(), restEnd:null, restTotal:0,
    exercises: plan ? plan.items.map(it => ({exId:it.exId, rest:num(it.rest)||null, target:{sets:it.sets, reps:it.reps, kg:it.kg}, sets:blankSets(num(it.sets) || (lastSets(it.exId)||[]).length || 3)})) : []};
  save(); view="workout"; sub=null; render(); syncWake(); window.scrollTo(0,0);
}
async function finishWorkout(){
  const A = S.active;
  const done = A.exercises.map(x => {
    const type = getEx(x.exId).type;
    return {exId:x.exId, sets:x.sets.filter(s=>s.done).map(s => type==="t" ? {t:parseTime(s.t)} : {kg:num(s.kg), reps:num(s.reps)})};
  }).filter(x => x.sets.length);
  const open = A.exercises.reduce((a,x)=> a + x.sets.filter(s=>!s.done).length, 0);
  if(!done.length){
    if(await ask("No sets are marked done, so there is nothing to save. Discard this workout?", "Discard", true)){ S.active=null; save(); syncWake(); render(); }
    return;
  }
  if(open && !await ask(`${open} set${open>1?"s are":" is"} not marked done and won't be saved. Finish anyway?`, "Finish")) return;
  const w = {id:A.id, planId:A.planId, name:A.name||"Workout", start:A.start, end:Math.max(Date.now(), A.start+60000), exercises:done};
  S.history.push(w); S.history.sort((a,b)=>a.start-b.start); S.active=null; save(); syncWake();
  const pr = workoutPRs(w);
  view="history"; sub={k:"hist", id:w.id}; render(); window.scrollTo(0,0);
  toast(pr.list.length ? `Workout saved. New record${pr.list.length>1?"s":""}: ` + pr.list.map(p=>`${exMain(getEx(p.exId))} ${setText(p.s,p.type)}`).join("; ") : "Workout saved");
}
function startRest(sec){ const A = S.active; A.restTotal = sec; A.restEnd = Date.now() + sec*1000; save(); tick(); }

/* ---------- render ---------- */
function render(){
  const v = {plans:vPlans, workout:vWorkout, progress:vProgress, history:vHistory, settings:vSettings}[view];
  $("#main").innerHTML = v();
  document.querySelectorAll("#tabs button").forEach(b => {
    b.removeAttribute("aria-current");
    if(b.dataset.tab===view) b.setAttribute("aria-current","page");
    b.classList.toggle("live", b.dataset.tab==="workout" && !!S.active);
  });
  tick();
}
function tick(){
  const A = S.active, el = $("#elapsed");
  if(A && el) el.textContent = fmtTime(Math.max(0,(Date.now()-A.start)/1000));
  const R = $("#rest");
  if(A && A.restEnd){
    const left = (A.restEnd - Date.now())/1000;
    if(left <= 0){ A.restEnd = null; save(); R.innerHTML = ""; alertDone(); toast("Rest is over"); return; }
    const pct = 100 - Math.min(100, left / (A.restTotal||1) * 100);
    if(!R.firstChild) R.innerHTML = `<div class="rest" role="timer" aria-label="Rest timer"><div class="bar"></div><div class="time"></div><button data-act="restAdj" data-v="-15">−15</button><button data-act="restAdj" data-v="15">+15</button><button data-act="restSkip">Skip</button></div>`;
    R.querySelector(".time").textContent = "Rest " + fmtTime(Math.ceil(left));
    R.querySelector(".bar").style.width = pct + "%";
  } else R.innerHTML = "";
}
setInterval(tick, 500);

/* ---------- events ---------- */
document.addEventListener("focusin", ev => {
  const t = ev.target;
  if(t.matches && t.matches("input[data-sel]")) setTimeout(() => { try{ t.select(); }catch(e){} }, 0);
});

document.addEventListener("click", async ev => {
  const b = ev.target.closest("[data-act],[data-tab]");
  if(!b || b.disabled) return;
  if(b.dataset.tab){ if(sub && sub.k==="hist" && sub.edit) closeHistEdit(); view = b.dataset.tab; sub = null; render(); window.scrollTo(0,0); return; }
  const a = b.dataset.act, A = S.active;
  const plan = sub && sub.k==="plan" ? S.plans.find(p=>p.id===sub.id) : null;
  const hw = sub && sub.k==="hist" ? S.history.find(w=>w.id===sub.id) : null;
  switch(a){
    case "tab": view=b.dataset.v; sub=null; render(); break;
    case "back": if(sub && sub.k==="hist" && sub.edit) closeHistEdit(); sub = sub && sub.from ? sub.from : null; if(sub && sub.k==="ex") view="progress"; render(); window.scrollTo(0,0); break;
    case "newPlan": { const p={id:uid(), name:"", note:"", items:[]}; S.plans.push(p); save(); sub={k:"plan", id:p.id}; render(); setTimeout(()=>$("#pname")&&$("#pname").focus(),30); break; }
    case "editPlan": sub={k:"plan", id:b.dataset.id}; render(); window.scrollTo(0,0); break;
    case "startPlan": startWorkout(S.plans.find(p=>p.id===b.dataset.id)); break;
    case "startTpl": { const t=TEMPLATES.find(x=>x.id===b.dataset.id); startWorkout({id:t.id, name:t.name, note:t.note, items:tplToItems(t)}); break; }
    case "copyTpl": { const t=TEMPLATES.find(x=>x.id===b.dataset.id); const p={id:uid(), name:t.name, note:t.note, items:tplToItems(t)}; S.plans.push(p); save(); sub={k:"plan", id:p.id}; render(); window.scrollTo(0,0); toast("Copied. Change anything you like."); break; }
    case "startEmpty": startWorkout(null); break;
    case "itemUp": case "itemDown": { const i=+b.dataset.i, j=a==="itemUp"?i-1:i+1; [plan.items[i],plan.items[j]]=[plan.items[j],plan.items[i]]; save(); render(); break; }
    case "itemDel": plan.items.splice(+b.dataset.i,1); save(); render(); break;
    case "dupPlan": { const c=JSON.parse(JSON.stringify(plan)); c.id=uid(); c.name=(plan.name||"Plan")+" (copy)"; S.plans.push(c); save(); sub={k:"plan",id:c.id}; render(); toast("Plan duplicated"); break; }
    case "delPlan": if(await ask(`Delete the plan "${plan.name||"Untitled plan"}"? Past workouts stay in History.`, "Delete", true)){ S.plans=S.plans.filter(p=>p.id!==plan.id); save(); sub=null; render(); } break;
    case "pick": openPicker(b.dataset.v); break;
    case "pickClose": picker=null; renderPicker(); break;
    case "pickCat": picker.cat=b.dataset.v; renderPicker(true); break;
    case "pickToggle": { const id=b.dataset.id, i=picker.sel.indexOf(id); i<0 ? picker.sel.push(id) : picker.sel.splice(i,1); renderPicker(true); break; }
    case "pickCreate": {
      const name = picker.q.trim(); if(!name) break;
      picker.newType = $("#ntype").value; picker.newCat = $("#ncat").value;
      const c = {id:"c_"+uid(), en:name, pl:name, cs:name, sk:name, cat:picker.newCat, type:picker.newType};
      S.custom.push(c); save(); rebuildEx(); picker.sel.push(c.id); picker.q=""; $("#pq").value=""; renderPicker(true); toast(`Created ${name}`); break;
    }
    case "pickAdd": {
      if(picker.mode==="plan" && plan) picker.sel.forEach(id => plan.items.push({exId:id, sets:3, reps:getEx(id).type==="t"?"1:00":"8–12", kg:"", rest:""}));
      if(picker.mode==="workout" && A) picker.sel.forEach(id => A.exercises.push({exId:id, rest:null, target:null, sets:blankSets((lastSets(id)||[]).length || 3)}));
      if(picker.mode==="hist" && hw) picker.sel.forEach(id => hw.exercises.push({exId:id, sets:[getEx(id).type==="t" ? {t:null} : {kg:null, reps:null}]}));
      picker=null; renderPicker(); save(); render(); break;
    }
    case "toggleSet": {
      const x=A.exercises[+b.dataset.x], s=x.sets[+b.dataset.s];
      if(!s.done){
        b.closest("tr").querySelectorAll("input[data-f]").forEach(inp => { if(inp.value==="" && inp.dataset.ph){ s[inp.dataset.f]=inp.dataset.ph; } });
        const type=getEx(x.exId).type;
        if(type==="t" ? !parseTime(s.t) : num(s.reps)==null){ toast(type==="t" ? "Enter a time first" : "Enter reps first"); render(); break; }
        s.done=true; save(); render();
        if(!A.exercises.every(e=>e.sets.every(z=>z.done))) startRest(x.rest || S.settings.rest);
      } else { s.done=false; save(); render(); }
      break;
    }
    case "addSet": { const x=A.exercises[+b.dataset.x], l=x.sets[x.sets.length-1]; x.sets.push({kg:l?l.kg:"", reps:l?l.reps:"", t:l?l.t:"", done:false}); save(); render(); break; }
    case "delSet": A.exercises[+b.dataset.x].sets.pop(); save(); render(); break;
    case "wxUp": { const i=+b.dataset.x; [A.exercises[i-1],A.exercises[i]]=[A.exercises[i],A.exercises[i-1]]; save(); render(); break; }
    case "wxDel": if(await ask(`Remove ${exMain(getEx(A.exercises[+b.dataset.x].exId))} from this workout?`, "Remove", true)){ A.exercises.splice(+b.dataset.x,1); save(); render(); } break;
    case "finish": finishWorkout(); break;
    case "discard": if(await ask("Discard this workout? Nothing from it will be saved.", "Discard", true)){ S.active=null; save(); syncWake(); render(); } break;
    case "restAdj": if(A && A.restEnd){ A.restEnd += (+b.dataset.v)*1000; A.restTotal = Math.max(1, A.restTotal + (+b.dataset.v)); save(); tick(); } break;
    case "restSkip": if(A){ A.restEnd=null; save(); tick(); } break;
    case "openHist": sub={k:"hist", id:b.dataset.id}; render(); window.scrollTo(0,0); break;
    case "openHistFrom": { const from = sub; view="history"; sub={k:"hist", id:b.dataset.id, from}; render(); window.scrollTo(0,0); break; }
    case "histEdit": sub.edit=true; render(); break;
    case "histDone": closeHistEdit(); sub.edit=false; render(); toast("Changes saved"); break;
    case "hAddSet": { const x=hw.exercises[+b.dataset.x], l=x.sets[x.sets.length-1]||{}; x.sets.push(Object.assign({}, l)); save(); render(); break; }
    case "hDelSet": hw.exercises[+b.dataset.x].sets.splice(+b.dataset.s,1); save(); render(); break;
    case "hDelEx": if(await ask(`Remove ${exMain(getEx(hw.exercises[+b.dataset.x].exId))} from this workout?`, "Remove", true)){ hw.exercises.splice(+b.dataset.x,1); save(); render(); } break;
    case "delHist": if(await ask("Delete this workout from History?", "Delete", true)){ S.history=S.history.filter(w=>w.id!==sub.id); save(); sub=sub.from||null; if(sub && sub.k==="ex") view="progress"; render(); } break;
    case "histToPlan": {
      const p={id:uid(), name:hw.name, note:"", items:hw.exercises.map(x=>{ const t=getEx(x.exId).type==="t", s=x.sets[0]||{}; return {exId:x.exId, sets:x.sets.length, reps:t?fmtTime(s.t):String(s.reps??""), kg:t?"":(s.kg??""), rest:""}; })};
      S.plans.push(p); save(); view="plans"; sub={k:"plan", id:p.id}; render(); toast("Plan created"); break;
    }
    case "openEx": sub={k:"ex", id:b.dataset.id}; render(); window.scrollTo(0,0); break;
    case "exMetric": sub.m=b.dataset.v; render(); break;
    case "lang": S.settings.lang=b.dataset.v; document.documentElement.lang=b.dataset.v; save(); render(); break;
    case "alt": S.settings.alt=b.dataset.v; save(); render(); break;
    case "export": exportData(); break;
    case "import": $("#importFile").click(); break;
    case "copyBackup": { const ta=$("#backupText"); ta.select(); try{ await navigator.clipboard.writeText(ta.value); toast("Copied"); }catch(e){ toast("Select the text and copy it manually"); } break; }
    case "delCustom": {
      const used = S.plans.some(p=>p.items.some(i=>i.exId===b.dataset.id)) || S.history.some(w=>w.exercises.some(x=>x.exId===b.dataset.id));
      if(await ask(used ? "This exercise is used in plans or History. Delete it anyway? It will show as 'Removed exercise' there." : "Delete this exercise?", "Delete", true)){ S.custom=S.custom.filter(c=>c.id!==b.dataset.id); save(); rebuildEx(); render(); }
      break;
    }
    case "wipe": if(await ask("Erase all plans, history and settings on this device? This cannot be undone.", "Erase", true)){ S=defaults(); save(); rebuildEx(); view="plans"; sub=null; render(); } break;
  }
});
function closeHistEdit(){
  const w = sub && S.history.find(x=>x.id===sub.id); if(!w) return;
  w.exercises = w.exercises.filter(x => x.sets.length);
  if(!w.name.trim()) w.name = "Workout";
  S.history.sort((a,b)=>a.start-b.start); save();
}

document.addEventListener("input", ev => {
  const el = ev.target, k = el.dataset.bind; if(!k) return;
  const plan = sub && sub.k==="plan" ? S.plans.find(p=>p.id===sub.id) : null;
  const hw = sub && sub.k==="hist" ? S.history.find(w=>w.id===sub.id) : null;
  if(k==="planName" && plan) plan.name = el.value;
  else if(k==="planNote" && plan) plan.note = el.value;
  else if(k==="item" && plan) plan.items[+el.dataset.i][el.dataset.f] = el.value;
  else if(k==="wName" && S.active) S.active.name = el.value;
  else if(k==="wStart" && S.active){ const t = fromLocalInput(el.value); if(t && t <= Date.now()){ S.active.start = t; tick(); } }
  else if(k==="set" && S.active) S.active.exercises[+el.dataset.x].sets[+el.dataset.s][el.dataset.f] = el.value;
  else if(k==="hName" && hw) hw.name = el.value;
  else if(k==="hStart" && hw){ const t = fromLocalInput(el.value); if(t){ const d = hw.end - hw.start; hw.start = t; hw.end = t + d; } }
  else if(k==="hDur" && hw){ const m = parseInt(el.value); if(m > 0) hw.end = hw.start + m*60000; }
  else if(k==="hSet" && hw){ const s = hw.exercises[+el.dataset.x].sets[+el.dataset.s]; s[el.dataset.f] = el.dataset.f==="t" ? parseTime(el.value) : num(el.value); }
  else if(k==="rest"){ const n=parseInt(el.value); if(n>0) S.settings.rest=n; }
  else if(k==="sound") S.settings.sound = el.checked;
  else if(k==="wake"){ S.settings.wake = el.checked; syncWake(); }
  else if(k==="templates") S.settings.templates = el.checked;
  save();
});

document.addEventListener("change", ev => {
  if(ev.target.id!=="importFile") return;
  const f = ev.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = async () => { await importText(r.result); ev.target.value=""; };
  r.readAsText(f);
});

async function importText(txt){
  let d; try{ d = JSON.parse(txt); }catch(e){ toast("That file is not a valid backup."); return; }
  if(!d || !Array.isArray(d.plans) || !Array.isArray(d.history)){ toast("That file is not a Lifts backup."); return; }
  if(!await ask(`Replace everything on this device with the backup (${d.plans.length} plans, ${d.history.length} workouts)?`, "Replace", true)) return;
  S = hydrate(d); save(); rebuildEx(); view="plans"; sub=null; render(); toast("Backup restored");
}

async function exportData(){
  const data = JSON.stringify(S, null, 1);
  const filename = `lifts-backup-${new Date().toISOString().slice(0,10)}.json`;
  if(downloads){
    try{ await downloads.save({filename, data}); toast("Backup saved"); return; }
    catch(e){ if(e && e.code==="declined") return; }
  } else {
    try{
      const url = URL.createObjectURL(new Blob([data], {type:"application/json"}));
      const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 4000); toast("Backup saved to Downloads"); return;
    }catch(e){}
  }
  $("#backupBox").innerHTML = `<p class="sub" style="margin:0 0 6px">Copy this text and keep it somewhere safe. To restore, save it as a .json file and use Import.</p>
    <textarea class="t" id="backupText" readonly style="min-height:120px;font-size:.8rem">${esc(data)}</textarea>
    <button class="btn sm" data-act="copyBackup" style="margin-top:8px">Copy</button>`;
}

document.documentElement.lang = S.settings.lang;
render(); syncWake();
if("serviceWorker" in navigator && window.isSecureContext){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
</body>
</html>
