<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F6BFF">
<title>Lifts</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontlink" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface2:#E8ECF3; --ink:#1A1F2B; --muted:#687085; --line:#DDE2EA;
  --accent:#2F6BFF; --accent-ink:#FFFFFF; --accent-soft:#E5EDFF; --danger:#E5484D; --success:#16A271;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --r-lg:16px; --r:12px; --r-sm:8px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1218; --surface:#181C24; --surface2:#232A36; --ink:#E9ECF2; --muted:#9AA3B5; --line:#2A3140;
    --accent:#5B8CFF; --accent-ink:#0B1020; --accent-soft:#1D2A4C; --danger:#FF6B6E; --success:#36CC93;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1218; --surface:#181C24; --surface2:#232A36; --ink:#E9ECF2; --muted:#9AA3B5; --line:#2A3140;
  --accent:#5B8CFF; --accent-ink:#0B1020; --accent-soft:#1D2A4C; --danger:#FF6B6E; --success:#36CC93;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 150px}
h1{font-family:var(--cond);font-weight:700;font-size:2.3rem;line-height:1;margin:8px 0 16px}
h2{font-family:var(--cond);font-weight:600;font-size:1.35rem;line-height:1.1;margin:0}
h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 8px;font-weight:600}
.sub{color:var(--muted);font-size:.9rem}
.row{display:flex;gap:8px;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:var(--r);padding:11px 16px;background:var(--surface2);font-weight:600;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.wide{width:100%}
.btn.sm{padding:6px 12px;min-height:36px;font-size:.9rem}
.btn:disabled{opacity:.45}
.icon{border:0;background:transparent;min-width:40px;min-height:40px;border-radius:var(--r-sm);font-size:1.05rem;color:var(--muted)}
.icon:active{background:var(--surface2)}
.icon:disabled{opacity:.3}
.stack>*+*{margin-top:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px}
.plan .names{color:var(--muted);font-size:.92rem;margin:4px 0 12px}
.plan.tpl{background:transparent;border-style:dashed}
.banner{background:var(--accent);color:var(--accent-ink);border-radius:var(--r-lg);padding:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.banner .btn{background:var(--accent-ink);color:var(--accent)}
.empty{border:2px dashed var(--line);border-radius:var(--r-lg);padding:22px;text-align:center;color:var(--muted)}
label.f,.f{display:block;font-size:.85rem;color:var(--muted)}
input.t,textarea.t,select.t{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;min-height:44px}
textarea.t{min-height:70px;resize:vertical}
.name-in{font-family:var(--cond);font-size:1.6rem;font-weight:600;border:0;border-bottom:2px solid var(--line);background:transparent;width:100%;padding:4px 0;border-radius:0}
.name-in:focus{outline:none;border-bottom-color:var(--accent)}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.item .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.item .grid input{width:100%;text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 4px;min-height:42px}
.exname{font-weight:600;line-height:1.25}
.exname small{display:block;font-weight:400;color:var(--muted);font-size:.85rem}
/* workout */
.clock{white-space:nowrap;font-family:var(--cond);font-weight:700;font-size:clamp(2.3rem,11vw,3.3rem);line-height:.9;font-variant-numeric:tabular-nums}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.ex-h{padding:12px 8px 6px 14px;display:flex;justify-content:space-between;gap:6px}
.ex .ex-h .exname{color:var(--accent);font-size:1.05rem}
.target{color:var(--muted);font-size:.85rem;padding:0 14px 8px}
.sets{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.sets th{font-size:.72rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;text-align:center;padding:4px 2px}
.sets td{text-align:center;padding:5px 3px}
.sets td.n{font-weight:700;width:40px}
.sets td.prev{color:var(--muted);font-size:.85rem;width:24%;text-align:left;padding-left:8px}
.sets th.prevh{text-align:left;padding-left:8px}
.sets input{width:100%;max-width:84px;text-align:center;background:var(--surface2);border:1px solid transparent;border-radius:var(--r-sm);padding:8px 2px;min-height:40px;font-size:1.05rem;font-weight:600}
.sets input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.sets input::placeholder{color:var(--muted);opacity:.7;font-weight:500}
.chk{width:38px;height:38px;border-radius:var(--r-sm);border:2px solid var(--line);background:transparent;font-size:1rem;color:transparent;font-weight:700}
tr.done td{background:var(--accent-soft)}
tr.done input{background:transparent}
tr.done .chk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ex-f{display:flex;gap:8px;padding:8px 12px 12px}
.rest{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--accent);color:var(--accent-ink);padding:10px 16px;display:flex;align-items:center;gap:10px;overflow:hidden}
.rest .bar{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.18);pointer-events:none}
.rest .time{font-family:var(--cond);font-weight:700;font-size:2rem;font-variant-numeric:tabular-nums;position:relative;flex:1}
.rest button{position:relative;background:rgba(255,255,255,.2);border:0;color:inherit;border-radius:var(--r-sm);min-height:40px;padding:0 12px;font-weight:600}
.badge{display:inline-block;background:var(--success);color:#fff;font-size:.68rem;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle;letter-spacing:.03em}
/* history */
.hist{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stats{display:flex;gap:16px;color:var(--muted);font-size:.88rem;margin-top:4px;flex-wrap:wrap}
.month{font-family:var(--cond);font-weight:600;color:var(--muted);font-size:1.05rem;margin:18px 0 8px}
.setline{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.95rem}
/* progress */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.tile b{display:block;font-family:var(--cond);font-size:1.8rem;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:.85rem}
.chart{width:100%;height:auto;display:block}
.c-grid{stroke:var(--line);stroke-width:1}
.c-line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.c-area{fill:var(--accent-soft)}
.c-dot{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.c-bar{fill:var(--accent)}
.c-bar.dim{fill:var(--accent-soft)}
.c-txt{fill:var(--muted);font-size:10px;font-family:var(--body)}
.hb{display:grid;grid-template-columns:110px 1fr 34px;gap:8px;align-items:center;font-size:.9rem;margin:6px 0}
.hb .track{background:var(--surface2);border-radius:5px;height:10px;overflow:hidden}
.hb .fill{background:var(--accent);height:100%;border-radius:5px}
.prrow{display:flex;width:100%;text-align:left;justify-content:space-between;align-items:center;gap:10px;background:transparent;border:0;border-bottom:1px solid var(--line);padding:11px 2px}
.prrow:last-child{border-bottom:0}
.prrow .val{font-size:.88rem;color:var(--muted)}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{flex:1;border:0;background:transparent;height:64px;font-weight:600;color:var(--muted);position:relative;font-size:.85rem;padding:0 2px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:20%;right:20%;height:3px;background:var(--accent);border-radius:0 0 3px 3px}
nav.tabs .live::after{content:"";position:absolute;top:14px;right:calc(50% - 34px);width:8px;height:8px;border-radius:50%;background:var(--success)}
/* sheet */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-h{padding:12px 16px 8px;max-width:640px;width:100%;margin:0 auto}
.sheet-b{flex:1;overflow-y:auto;padding:0 16px 16px;max-width:640px;width:100%;margin:0 auto}
.sheet-f{padding:10px 16px 14px;border-top:1px solid var(--line);background:var(--surface);max-width:640px;width:100%;margin:0 auto}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pick{display:flex;width:100%;text-align:left;justify-content:space-between;align-items:center;gap:10px;background:transparent;border:0;border-bottom:1px solid var(--line);padding:11px 4px;min-height:56px}
.pick .mark{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:700}
.pick[aria-pressed="true"] .mark{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.grp{font-family:var(--cond);font-weight:600;color:var(--muted);margin:16px 0 2px;font-size:1.05rem}
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,14,20,.5);display:grid;place-items:center;padding:20px}
.modal .box{background:var(--surface);border-radius:var(--r-lg);padding:18px;max-width:420px;width:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r-sm);font-size:.95rem;max-width:90vw}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.seg button{flex:1 1 auto;border:0;background:transparent;padding:9px 8px;min-height:42px;font-weight:600;color:var(--muted);font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sw{border:2px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px;font-size:.8rem;font-weight:600;display:flex;flex-direction:column;gap:6px;align-items:stretch;text-align:center}
.sw[aria-pressed="true"]{border-color:var(--accent)}
.sw-p{display:block;height:42px;border-radius:var(--r-sm);border:1px solid rgba(128,128,128,.35);position:relative;overflow:hidden}
.sw-p i{position:absolute;left:6px;right:6px;top:6px;height:14px;border-radius:4px}
.sw-p b{position:absolute;right:8px;bottom:6px;width:16px;height:16px;border-radius:50%}
.colrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.colrow input[type=color]{width:52px;height:36px;border:1px solid var(--line);border-radius:var(--r-sm);background:transparent;padding:2px}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent)}
.preview{border:1px dashed var(--line);border-radius:var(--r);padding:10px 12px}
.preview .big{font-family:var(--cond);font-weight:700;font-size:1.6rem;line-height:1.1}
.diag{font-size:.88rem;color:var(--muted);display:grid;grid-template-columns:auto 1fr;gap:2px 12px}
.diag b{color:var(--ink);font-weight:600}
.ic{width:18px;height:18px;flex:none}
.icon .ic{width:20px;height:20px}
.icon.big .ic{width:28px;height:28px}
.icon.big{min-width:48px;min-height:48px;color:var(--accent)}
.clock.paused{opacity:.45}
.seg-ic{flex-wrap:nowrap}
.seg-ic button{flex:none;padding:6px 10px;min-height:38px;display:inline-flex;align-items:center}
.plangrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plan.mini{padding:12px;display:flex;flex-direction:column}
.plan.mini h2{font-size:1.15rem;overflow-wrap:anywhere}
.plan.mini .row{margin-top:auto}
.selrow{display:flex;align-items:center;gap:10px;padding:6px 2px;border-bottom:1px solid var(--line)}
.selrow .exname{flex:1;min-width:0}
.mark.on{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.8rem;font-weight:700}
.choice{display:flex;flex-direction:column;gap:8px}
.newtag{display:inline-block;font-size:.68rem;font-weight:700;border:1px solid var(--accent);color:var(--accent);border-radius:6px;padding:0 5px;margin-left:6px}
@font-face{font-family:"OpenDyslexic";src:url("fonts/OpenDyslexic-Regular.woff2") format("woff2");font-weight:400 500;font-display:swap}
@font-face{font-family:"OpenDyslexic";src:url("fonts/OpenDyslexic-Bold.woff2") format("woff2");font-weight:600 800;font-display:swap}
.wbar{position:sticky;top:0;z-index:15;background:var(--bg);margin:-16px -16px 12px;padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.wbar .spread{flex-wrap:wrap;row-gap:8px}
.tbtn{flex:none;width:50px;height:50px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--accent);display:grid;place-items:center}
.tbtn .ic{width:24px;height:24px}
.dtwrap{position:relative;display:block;margin-top:4px}
.dtwrap .ic{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:22px;height:22px;pointer-events:none;color:var(--ink);opacity:.75}
input.dt{-webkit-appearance:none;appearance:none;display:block;width:100%;min-height:46px;padding-right:48px;text-align:left;position:relative}
input.dt::-webkit-calendar-picker-indicator{position:absolute;right:0;top:0;width:48px;height:100%;margin:0;padding:0;opacity:0;cursor:pointer}
input.dt::-webkit-inner-spin-button,input.dt::-webkit-clear-button{display:none}
.clockbtn{background:none;border:0;padding:0;color:inherit;text-align:left}
.parrows{display:flex;gap:0;flex:none}
.parrows .icon{min-width:36px;min-height:36px}
.plan.mini .parrows{justify-content:flex-end;margin:-4px -6px 0 0}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 2px;font-size:.85rem;min-height:32px}
.exnote{display:block;border-left:3px solid var(--accent);padding-left:8px;color:var(--ink);margin:2px 0}
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 14px 8px}
.tgrid input{width:100%;text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 4px;min-height:40px}
.plan[data-act]{cursor:pointer}
.tgroup{font-size:.78rem;color:var(--muted);margin:10px 0 6px;font-weight:600}
.hr{height:1px;background:var(--line);margin:18px 0}
@media (prefers-reduced-motion:no-preference){ .chk,.btn,tr td{transition:background-color .15s} }
</style>
</head>
<body>
<main class="wrap" id="main"></main>
<div id="rest"></div>
<nav class="tabs" id="tabs">
  <button data-tab="plans">Plans</button>
  <button data-tab="workout">Workout</button>
  <button data-tab="progress">Progress</button>
  <button data-tab="history">History</button>
  <button data-tab="settings">Settings</button>
</nav>
<div id="layer"></div>

<script>
"use strict";
/* ---------- exercise library ----------
   [id, category, type, English, Polski, Čeština, Slovenčina, extra search words]
   type: w = weight + reps, bw = reps (+ optional extra kg), t = time */
const LIB = [
 ["bench","chest","w","Bench Press (Barbell)","Wyciskanie sztangi leżąc","Tlak na lavici","Tlak na lavičke","klata benchpress"],
 ["incbench","chest","w","Incline Bench Press (Barbell)","Wyciskanie sztangi na ławce skośnej","Tlak na šikmé lavici","Tlak na šikmej lavičke","skos"],
 ["decbench","chest","w","Decline Bench Press","Wyciskanie sztangi głową w dół","Tlak na lavici hlavou dolů","Tlak na lavičke hlavou dole",""],
 ["dbbench","chest","w","Dumbbell Bench Press","Wyciskanie hantli leżąc","Tlak s jednoručkami na lavici","Tlak s jednoručkami na lavičke","db"],
 ["incdb","chest","w","Incline Dumbbell Press","Wyciskanie hantli na ławce skośnej","Tlak s jednoručkami na šikmé lavici","Tlak s jednoručkami na šikmej lavičke","db skos"],
 ["dbfly","chest","w","Dumbbell Fly","Rozpiętki z hantlami","Rozpažování s jednoručkami","Rozpažovanie s jednoručkami","flyes"],
 ["cablefly","chest","w","Cable Fly (Crossover)","Rozpiętki na bramie","Rozpažování na kladkách","Rozpažovanie na kladkách","wyciąg brama crossover"],
 ["pecdeck","chest","w","Pec Deck","Rozpiętki na maszynie (butterfly)","Peck-deck (butterfly)","Butterfly na stroji","motylek"],
 ["chestpress","chest","w","Chest Press (Machine)","Wyciskanie na maszynie siedząc","Tlak na hrudním stroji","Tlak na hrudník na stroji",""],
 ["pushup","chest","bw","Push-up","Pompki","Kliky","Kľuky",""],
 ["dips","chest","bw","Dips","Pompki na poręczach (dipy)","Kliky na bradlech (dipy)","Kľuky na bradlách (dipy)","porecze"],
 ["deadlift","back","w","Deadlift","Martwy ciąg","Mrtvý tah","Mŕtvy ťah","dl mc"],
 ["sumodl","back","w","Sumo Deadlift","Martwy ciąg sumo","Mrtvý tah sumo","Mŕtvy ťah sumo",""],
 ["pullup","back","bw","Pull-up","Podciąganie nachwytem","Shyby nadhmatem","Zhyby nadhmatom","drazek hrazda"],
 ["chinup","back","bw","Chin-up","Podciąganie podchwytem","Shyby podhmatem","Zhyby podhmatom","drazek hrazda"],
 ["latpull","back","w","Lat Pulldown","Ściąganie drążka wyciągu górnego","Stahování horní kladky","Sťahovanie hornej kladky","lat wyciag"],
 ["bbrow","back","w","Barbell Row","Wiosłowanie sztangą w opadzie","Přítahy velké činky v předklonu","Príťahy veľkej činky v predklone",""],
 ["dbrow","back","w","Dumbbell Row","Wiosłowanie hantlem jednorącz","Přítahy jednoručky v předklonu","Príťahy jednoručky v predklone",""],
 ["cablerow","back","w","Seated Cable Row","Wiosłowanie siedząc na wyciągu","Přítahy spodní kladky vsedě","Príťahy spodnej kladky v sede",""],
 ["tbar","back","w","T-Bar Row","Wiosłowanie sztangą T","Přítahy T-osy","Príťahy T-osi",""],

function hydrate(d){
  const base = defaults(), s = Object.assign(base.settings, d.settings||{});
  if(!d.settings || d.settings.alt===undefined) s.alt = s.lang==="en" ? "pl" : "en";
  s.ap = Object.assign(apDefaults(), (d.settings && d.settings.ap) || {}); s.ap.custom = Object.assign({}, s.ap.custom||{});

}

/* ---------- plan drafts (unsaved edits) ---------- */
const clone = o => JSON.parse(JSON.stringify(o));
function isDirty(){
  const D = S.draft; if(!D) return false;
  if(D.base!=null) return JSON.stringify(D.data) !== D.base;
  if(D.isNew) return !!(D.data.name.trim() || D.data.note.trim() || D.data.items.length);
  const p = S.plans.find(x=>x.id===D.id); if(!p) return true;
  return JSON.stringify(p) !== JSON.stringify(D.data);
}
const draftName = () => S.draft ? (S.draft.data.name.trim() || "Untitled plan") : "";
function commitDraft(){
  const D = S.draft; if(!D) return;
  const p = clone(D.data); if(!p.name.trim()) p.name = "Untitled plan";
  const i = S.plans.findIndex(x=>x.id===p.id);
  if(i<0) S.plans.push(p); else S.plans[i] = p;
  S.draft = null; save();
}
function openDraft(p, isNew, fromTpl){ S.draft = {id:p.id, isNew:!!isNew, fromTpl:fromTpl||null, data:clone(p), base:JSON.stringify(p)}; save(); sub = {k:"plan", id:p.id}; }
async function leaveDraft(){ // true = ok to leave
  if(!S.draft) return true;
  if(!isDirty()){ S.draft = null; save(); return true; }
  const r = await askChoice(`Save the changes to "${draftName()}"?`, [{v:"save",label:"Save",kind:"primary"},{v:"discard",label:"Discard changes",kind:"danger"},{v:"",label:"Keep editing",kind:"ghost"}]);
  if(r==="save"){ commitDraft(); toast("Plan saved"); return true; }
  if(r==="discard"){ S.draft = null; save(); return true; }
  return false;
}
function placeholders(x, si){
  const e = getEx(x.exId), p = (lastSets(x.exId)||[])[si], tg = x.target;
  return {
    kg: p && p.kg!=null ? fmtKg(p.kg) : (tg && tg.kg!=="" && tg.kg!=null ? String(tg.kg) : (e.type==="bw" ? "0" : "")),
    reps: p && p.reps!=null ? String(p.reps) : (tg && tg.reps ? (String(tg.reps).match(/\d+/)||[""])[0] : ""),
    t: p && p.t ? fmtTime(p.t) : (tg && tg.reps ? String(tg.reps) : "")
  };
}
function fillSet(x, si){
  const s = x.sets[si], ph = placeholders(x, si), type = getEx(x.exId).type;
  ["kg","reps","t"].forEach(f => { if((s[f]==="" || s[f]==null) && ph[f]) s[f] = ph[f]; });
  return type==="t" ? !!parseTime(s.t) : num(s.reps)!=null;
}

const num = v => { if(v==null || v==="") return null; const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : null; };

const fmtNum = (n, d=1) => Number(n).toLocaleString(locale(), {maximumFractionDigits:d});
const fmtKg = n => n==null || n==="" ? "" : fmtNum(n, 2);

function parseTime(v){
  if(v==null || v==="") return null;
  const s = String(v).trim();
  if(s.includes(":")){ const [m,sec] = s.split(":"); const r = (parseInt(m)||0)*60 + (parseInt(sec)||0); return r||null; }
  const n = parseInt(s); return isFinite(n) && n>0 ? n : null;
}
const fmtTime = s => { if(s==null || s==="") return ""; s=Math.max(0,Math.round(s)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h? h+":"+String(m).padStart(2,"0") : m) + ":" + String(x).padStart(2,"0"); };
const fmtDate = ts => new Date(ts).toLocaleDateString(locale(), {weekday:"short", day:"numeric", month:"short"});
const fmtDateY = ts => new Date(ts).toLocaleDateString(locale(), {day:"numeric", month:"short", year:"numeric"});
const fmtShort = ts => new Date(ts).toLocaleDateString(locale(), {day:"numeric", month:"numeric"});
const fmtMonth = ts => new Date(ts).toLocaleDateString(locale(), {month:"long", year:"numeric"});
const fmtDur = ms => { const m = Math.max(0, Math.round(ms/60000)); return m<60 ? m+" min" : Math.floor(m/60)+" h "+(m%60)+" min"; };
const pad2 = n => String(n).padStart(2,"0");

const exMain = e => e[S.settings.lang] || e.en;

function lastSets(exId){
  for(let i=S.history.length-1; i>=0; i--){
    const e = S.history[i].exercises.find(x => x.exId===exId);
    if(e && e.sets.length) return e.sets;

function setText(s, type){
  if(type==="t") return fmtTime(s.t) || "–";
  if(type==="bw") return (s.kg ? "+"+fmtKg(s.kg)+" kg × " : "") + (s.reps??"–") + (s.kg ? "" : " reps");
  return (s.kg!=null ? fmtKg(s.kg)+" kg" : "– kg") + " × " + (s.reps ?? "–");
}
function vol(w){ return w.exercises.reduce((a,e)=> a + e.sets.reduce((b,s)=> b + ((s.kg||0)*(s.reps||0)),0),0); }

/* ---------- records ---------- */
const e1rm = s => (s.kg>0 && s.reps>0) ? (s.reps===1 ? s.kg : s.kg*(1+s.reps/30)) : 0;
function bestOf(type, sets){
  const r = {kg:0, e1rm:0, vol:0, setVol:0, reps:0, t:0, top:null};
  sets.forEach(s => {
    const kg=s.kg||0, reps=s.reps||0, t=s.t||0;
    if(type==="t"){ if(t>r.t){ r.t=t; r.top=s; } return; }
    if(type==="bw"){
      if(reps>r.reps || (reps===r.reps && r.top && kg>(r.top.kg||0))){ r.reps=reps; r.top=s; }
      if(kg>r.kg) r.kg=kg; r.vol += kg*reps; return;
    }
    if(!r.top || kg>r.kg || (kg===r.kg && reps>(r.top.reps||0))){ r.kg=kg; r.top=s; }
    const e=e1rm(s); if(e>r.e1rm) r.e1rm=e;
    r.vol += kg*reps; if(kg*reps>r.setVol) r.setVol=kg*reps;
  });
  return r;
}
function sessions(exId){
  const type = getEx(exId).type, out = [];
  S.history.forEach(w => {
    const sets = w.exercises.filter(x=>x.exId===exId).flatMap(x=>x.sets);
    if(sets.length) out.push({w, start:w.start, sets, b:bestOf(type, sets)});
  });
  return out;
}
function records(exId){
  const ss = sessions(exId); if(!ss.length) return null;
  const type = getEx(exId).type, best = {}, when = {};
  const keys = type==="w" ? ["kg","e1rm","setVol","vol"] : type==="bw" ? ["reps","kg"] : ["t"];
  ss.forEach(s => keys.forEach(k => { if((s.b[k]||0) > (best[k]||0)){ best[k]=s.b[k]; when[k]=s.start; } }));
  return {type, best, when, last:ss[ss.length-1].start, n:ss.length, ss};
}
function workoutPRs(w){
  const marks = new Set(), list = [];
  w.exercises.forEach((x, xi) => {
    const type = getEx(x.exId).type;
    const prev = S.history.filter(h => h.start < w.start && h.id!==w.id).flatMap(h => h.exercises.filter(y=>y.exId===x.exId).flatMap(y=>y.sets));
    if(!prev.length) return;
    const pb = bestOf(type, prev); let got = null;
    x.sets.forEach((s, si) => {
      let pr;
      if(type==="t") pr = (s.t||0) > pb.t;
      else if(type==="bw") pr = (s.reps||0) > pb.reps;
      else pr = (s.kg||0) > pb.kg || e1rm(s) > pb.e1rm + 0.01;
      if(pr){ marks.add(xi+"-"+si); got = s; }
      pb.t = Math.max(pb.t, s.t||0); pb.reps = Math.max(pb.reps, s.reps||0); pb.kg = Math.max(pb.kg, s.kg||0); pb.e1rm = Math.max(pb.e1rm, e1rm(s));
    });
    if(got) list.push({exId:x.exId, s:got, type});
  });
  return {marks, list};
}

/* ---------- toast / confirm ---------- */
let toastT;
function toast(msg){
  clearTimeout(toastT);
  let el = $("#toast"); if(!el){ el = document.createElement("div"); el.id="toast"; el.className="toast"; el.setAttribute("role","status"); document.body.appendChild(el); }
  el.textContent = msg; el.hidden = false;
  toastT = setTimeout(()=> el.hidden = true, msg.length > 60 ? 4500 : 2600);
}
function askChoice(msg, opts){
  return new Promise(res => {
    const d = document.createElement("div");
    d.className = "modal";
    d.innerHTML = `<div class="box" role="dialog" aria-modal="true"><p style="margin:0 0 16px">${esc(msg)}</p><div class="choice">${opts.map(o=>`<button class="btn ${o.kind||"ghost"}" data-r="${esc(o.v)}">${esc(o.label)}</button>`).join("")}</div></div>`;
    d.addEventListener("click", ev => { const b = ev.target.closest("[data-r]"); if(b || ev.target===d){ ev.stopPropagation(); d.remove(); res(b ? b.dataset.r || null : null); } });
    $("#layer").appendChild(d);
  });
}
function ask(msg, ok="OK", danger=false){
  return new Promise(res => {
    const d = document.createElement("div");
    d.className = "modal";
    d.innerHTML = `<div class="box" role="dialog" aria-modal="true"><p style="margin:0 0 16px">${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-r="0">Cancel</button><button class="btn ${danger?"danger":"primary"}" data-r="1">${esc(ok)}</button></div></div>`;
    d.addEventListener("click", ev => { const b = ev.target.closest("[data-r]"); if(b || ev.target===d){ ev.stopPropagation(); d.remove(); res(b ? b.dataset.r==="1" : false); } });
    $("#layer").appendChild(d); d.querySelector('[data-r="1"]').focus();
  });
}

  try{
    if(!AC) return;
    [0, .25].forEach(off => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(AC.destination);
      const t = AC.currentTime + off; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.35,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.18);
      o.start(t); o.stop(t+.2);
    });
  }catch(e){}
}

}

      h += `<td><button class="icon" aria-label="Delete set ${si+1}" data-act="hDelSet" data-x="${xi}" data-s="${si}">✕</button></td></tr>`;
    });
    h += `</tbody></table><div class="ex-f"><button class="btn sm" style="flex:1" data-act="hAddSet" data-x="${xi}">+ Add set</button></div></section>`;
  });
  h += `<button class="btn primary wide" data-act="pick" data-v="hist">Add exercises</button></div>`;
  return h;
}

/* ---------- PROGRESS ---------- */
function weekStart(ts){ const d = new Date(ts); d.setHours(0,0,0,0); d.setDate(d.getDate() - (d.getDay()+6)%7); return d.getTime(); }
function lineChart(pts, fy){
  if(!pts.length) return `<div class="empty">No data for this yet.</div>`;
  const W=340, H=180, l=46, r=14, t=14, b=26;
  let x0 = pts[0].x, x1 = pts[pts.length-1].x; if(x1===x0){ x0 -= 864e5*3; x1 += 864e5*3; }
  const ys = pts.map(p=>p.y); let y0 = Math.min(...ys), y1 = Math.max(...ys);
  const padY = (y1-y0)*0.15 || Math.max(1, y1*0.1); y0 = Math.max(0, y0-padY); y1 = y1+padY;
  const X = x => l + (x-x0)/(x1-x0)*(W-l-r), Y = y => t + (1-(y-y0)/(y1-y0))*(H-t-b);
  const line = pts.map(p => `${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join(" ");
  let g = "";
  [y0, (y0+y1)/2, y1].forEach(v => g += `<line class="c-grid" x1="${l}" x2="${W-r}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text class="c-txt" x="${l-6}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end">${esc(fy(v))}</text>`);
  g += `<text class="c-txt" x="${l}" y="${H-8}">${esc(fmtShort(pts[0].x))}</text><text class="c-txt" x="${W-r}" y="${H-8}" text-anchor="end">${esc(fmtShort(pts[pts.length-1].x))}</text>`;
  const area = pts.length>1 ? `<polygon class="c-area" points="${X(pts[0].x).toFixed(1)},${H-b} ${line} ${X(pts[pts.length-1].x).toFixed(1)},${H-b}"/>` : "";
  const dots = pts.map(p => `<circle class="c-dot" cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3.5"><title>${esc(fmtDateY(p.x)+": "+fy(p.y))}</title></circle>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Progress chart">${g}${area}${pts.length>1?`<polyline class="c-line" points="${line}"/>`:""}${dots}</svg>`;
}
function barChart(bars, fy){
  const W=340, H=160, l=8, r=8, t=14, b=24, n=bars.length, gap=6;
  const max = Math.max(1, ...bars.map(x=>x.v)), bw = (W-l-r-gap*(n-1))/n;
  let g = `<line class="c-grid" x1="${l}" x2="${W-r}" y1="${H-b}" y2="${H-b}"/>`;
  bars.forEach((x, i) => {
    const hgt = (H-t-b) * x.v / max, X = l + i*(bw+gap);
    g += `<rect class="c-bar ${i===n-1?"":"dim"}" x="${X.toFixed(1)}" y="${(H-b-hgt).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(hgt, x.v?2:0).toFixed(1)}" rx="3"><title>${esc(x.label+": "+fy(x.v)+", "+x.n+" workouts")}</title></rect>`;
    if(i%3===0 || i===n-1) g += `<text class="c-txt" x="${(X+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${esc(x.label)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly volume chart">${g}</svg>`;
}
function recordSummary(r){
  if(r.type==="t") return `Longest ${fmtTime(r.best.t)}`;
  if(r.type==="bw") return `${r.best.reps||0} reps${r.best.kg ? `, up to +${fmtKg(r.best.kg)} kg` : ""}`;
  return `${fmtKg(r.best.kg||0)} kg heaviest, est. 1RM ${fmtKg(Math.round((r.best.e1rm||0)*2)/2)} kg`;
}
function vProgress(){
  if(sub && sub.k==="ex") return vExDetail();
  let h = `<h1>Progress</h1>`;
  if(!S.history.length) return h + `<div class="empty">Finish a workout to see records and charts here.</div>`;
  const now = Date.now(), d30 = now - 30*864e5, last30 = S.history.filter(w => w.start >= d30);
  const v30 = last30.reduce((a,w)=>a+vol(w),0), t30 = last30.reduce((a,w)=>a+(w.end-w.start),0);
  h += `<div class="tiles">
    <div class="tile"><b>${last30.length}</b><span>workouts, last 30 days</span></div>
    <div class="tile"><b>${fmtVol(v30)}</b><span>volume, last 30 days</span></div>
    <div class="tile"><b>${fmtDur(t30)}</b><span>training time, last 30 days</span></div>
    <div class="tile"><b>${S.history.length}</b><span>workouts in total</span></div></div>`;
  const ws = weekStart(now), bars = [];
  for(let i=11; i>=0; i--){
    const a = new Date(ws); a.setDate(a.getDate()-7*i); const b2 = new Date(a); b2.setDate(b2.getDate()+7);
    const inW = S.history.filter(w => w.start>=a.getTime() && w.start<b2.getTime());
    bars.push({label:fmtShort(a.getTime()), v:inW.reduce((s,w)=>s+vol(w),0), n:inW.length});
  }
  const avg = bars.slice(0,-1).reduce((s,x)=>s+x.v,0)/11;
  h += `<h3>Weekly volume (weight × reps)</h3><div class="panel">${barChart(bars, fmtVol)}<div class="stats"><span>This week: ${fmtVol(bars[11].v)}</span><span>Average week: ${fmtVol(avg)}</span></div></div>`;
  const cat = {}; let maxC = 0;
  last30.forEach(w => w.exercises.forEach(x => { const c = getEx(x.exId).cat; cat[c] = (cat[c]||0) + x.sets.length; }));
  Object.values(cat).forEach(v => maxC = Math.max(maxC, v));
  if(maxC){
    h += `<h3>Sets per body area, last 30 days</h3><div class="panel">`;
    Object.entries(cat).sort((a,b)=>b[1]-a[1]).forEach(([c,v]) => h += `<div class="hb"><span>${esc(catName(c))}</span><div class="track"><div class="fill" style="width:${(v/maxC*100).toFixed(0)}%"></div></div><span class="sub" style="text-align:right">${v}</span></div>`);
    h += `</div>`;
  }
  const ids = [...new Set(S.history.flatMap(w => w.exercises.map(x=>x.exId)))];
  const recs = ids.map(id => ({id, r:records(id)})).filter(x => x.r).sort((a,b)=>b.r.last-a.r.last);
  h += `<h3>Personal records</h3><div class="panel" style="padding:4px 12px">`;
  recs.forEach(({id, r}) => h += `<button class="prrow" data-act="openEx" data-id="${id}"><div>${exLabel(getEx(id))}<div class="val">${esc(recordSummary(r))}</div></div><span class="sub" style="flex:none">›</span></button>`);
  h += `</div>`;
  return h;
}
function vExDetail(){
  const e = getEx(sub.id), r = records(sub.id);
  let h = `<div class="row" style="margin-bottom:8px"><button class="btn ghost sm" data-act="back">Back to progress</button></div><h1 style="margin-bottom:6px">${esc(exMain(e))}</h1>${exAlt(e)?`<p class="sub" style="margin:0 0 12px">${esc(exAlt(e))}</p>`:""}`;
  if(!r) return h + `<div class="empty">No finished sets for this exercise yet.</div>`;
  const tile = (v, label, ts) => `<div class="tile"><b>${v}</b><span>${label}${ts?`<br>${esc(fmtDateY(ts))}`:""}</span></div>`;
  h += `<label class="f" style="margin-bottom:12px">Exercise note (shown in every plan and workout)<textarea class="t" data-bind="exNote" data-id="${sub.id}" style="margin-top:4px;min-height:60px" placeholder="e.g. grip width, seat height, cues">${esc((S.exNotes||{})[sub.id]||"")}</textarea></label>`;
  h += `<div class="tiles">`;
  if(r.type==="w"){
    h += tile(fmtKg(r.best.kg)+" kg", "heaviest weight", r.when.kg) + tile(fmtKg(Math.round(r.best.e1rm*2)/2)+" kg", "best estimated 1RM", r.when.e1rm)
       + tile(fmtVol(r.best.setVol), "best single set (kg × reps)", r.when.setVol) + tile(fmtVol(r.best.vol), "best session volume", r.when.vol);
  } else if(r.type==="bw"){
    h += tile(r.best.reps||0, "most reps in a set", r.when.reps) + tile(r.best.kg ? "+"+fmtKg(r.best.kg)+" kg" : "–", "most added weight", r.when.kg);
  } else h += tile(fmtTime(r.best.t), "longest set", r.when.t);
  h += tile(r.n, "sessions logged", null) + `</div>`;
  const metrics = r.type==="w" ? [["e1rm","Est. 1RM"],["kg","Heaviest"],["vol","Volume"]] : r.type==="bw" ? [["reps","Most reps"]] : [["t","Longest"]];
  const m = metrics.find(x=>x[0]===sub.m) ? sub.m : metrics[0][0];
  const fy = m==="t" ? v=>fmtTime(v) : m==="reps" ? v=>fmtNum(v,0) : m==="vol" ? fmtVol : v=>fmtKg(Math.round(v*2)/2)+" kg";
  h += `<h3>Progress over time</h3><div class="panel">`;
  if(metrics.length>1) h += `<div class="seg" style="margin-bottom:10px">${metrics.map(([k,l])=>`<button data-act="exMetric" data-v="${k}" aria-pressed="${k===m}">${l}</button>`).join("")}</div>`;
  h += lineChart(r.ss.map(s => ({x:s.start, y:s.b[m]||0})).filter(p=>p.y>0), fy);
  if(m==="e1rm") h += `<p class="sub" style="margin:8px 0 0">Estimated 1RM [one-rep max] uses the Epley formula: weight × (1 + reps ÷ 30). It is a guide, not a tested max.</p>`;
  h += `</div><h3>Sessions</h3><div class="panel" style="padding:4px 12px">`;
  [...r.ss].reverse().forEach(s => h += `<button class="prrow" data-act="openHistFrom" data-id="${s.w.id}"><div><strong>${esc(fmtDateY(s.start))}</strong><div class="val">${esc(s.sets.map(x=>setText(x,r.type)).join(", "))}</div></div><span class="sub" style="flex:none">›</span></button>`);
  return h + `</div>`;
}

/* ---------- plans as CSV ---------- */
const CSV_HEAD = ["plan","plan_note","exercise","sets","reps","kg","rest","note","type"];
const COL_ALIASES = {
  plan:["plan","plan name","plan_name","nazwa planu","plán"], plan_note:["plan_note","plan note","notatka planu","opis planu"],
  exercise:["exercise","cwiczenie","ćwiczenie","cvik"], sets:["sets","serie","série"], reps:["reps","powtórzenia","powtorzenia","opakování","opakovania","time","czas"],
  kg:["kg","weight","ciężar","ciezar","váha"], rest:["rest","przerwa","odpočinek","odpočinok"], note:["note","notatka","uwagi","poznámka"], type:["type","typ"]
};
const csvCell = v => { v = v==null ? "" : String(v); return /[",;\n\r\t]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; };
function plansToCSV(plans){
  const rows = [CSV_HEAD];
  plans.forEach(p => {
    if(!p.items.length) rows.push([p.name, p.note||"", "", "", "", "", "", "", ""]);
    p.items.forEach((it, i) => { const e = getEx(it.exId); rows.push([p.name||"Untitled plan", i===0 ? (p.note||"") : "", e.en, it.sets, it.reps, it.kg, it.rest, it.note||"", e.type]); });
  });
  return "\ufeff" + rows.map(r => r.map(csvCell).join(",")).join("\r\n") + "\r\n";
}
function parseCSV(text){
  text = String(text||"").replace(/^\ufeff/, "");
  const first = text.split(/\r?\n/)[0] || "", cnt = {",":0, ";":0, "\t":0};
  let inQ = false; for(const ch of first){ if(ch==='"') inQ = !inQ; else if(!inQ && ch in cnt) cnt[ch]++; }
  const best = Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0], d = best[1] ? best[0] : ",";
  const rows = []; let row = [], cell = "", q = false;
  for(let i=0; i<text.length; i++){
    const c = text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q = false; } else cell += c; }
    else if(c==='"') q = true;
    else if(c===d){ row.push(cell); cell = ""; }
    else if(c==="\n" || c==="\r"){ if(c==="\r" && text[i+1]==="\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if(cell!=="" || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim()!==""));
}
function findExByName(name){
  const strip = x => norm(x).replace(/\s*\(.*?\)\s*/g," ").replace(/\s+/g," ").trim();
  const k = norm(name).trim(); if(!k) return null;
  const all = allEx();
  return all.find(e => [e.id,e.en,e.pl,e.cs,e.sk].some(x => x && norm(x).trim()===k))
      || all.find(e => [e.en,e.pl,e.cs,e.sk].some(x => x && strip(x)===strip(name))) || null;
}
function previewCSV(text){
  const rows = parseCSV(text); if(!rows.length) return {plans:[], newEx:[], error:"Nothing to import yet."};
  const head = rows[0].map(h => norm(h).trim()), idx = {};
  Object.entries(COL_ALIASES).forEach(([key, al]) => { const i = head.findIndex(h => al.map(norm).includes(h)); if(i>=0) idx[key] = i; });
  let body = rows.slice(1);
  if(idx.plan==null || idx.exercise==null){ CSV_HEAD.forEach((k,i) => idx[k] = i); body = rows; }
  const get = (r,k) => idx[k]!=null ? String(r[idx[k]]??"").trim() : "";
  const plans = [], byName = {}, newEx = new Set();
  body.forEach(r => {
    const pn = get(r,"plan") || "Imported plan";
    let p = byName[pn]; if(!p){ p = byName[pn] = {name:pn, note:"", items:[]}; plans.push(p); }
    if(!p.note && get(r,"plan_note")) p.note = get(r,"plan_note");
    const exName = get(r,"exercise"); if(!exName) return;
    const ex = findExByName(exName); if(!ex) newEx.add(exName);
    const sets = parseInt(get(r,"sets")) || 3, reps = get(r,"reps"), t = get(r,"type").toLowerCase();
    p.items.push({exName, exId: ex ? ex.id : null, sets, reps, kg:get(r,"kg"), rest:(get(r,"rest").match(/\d+/)||[""])[0], note:get(r,"note"),
      type: ["w","bw","t"].includes(t) ? t : (reps.includes(":") ? "t" : "w")});
  });
  return {plans, newEx:[...newEx], error: plans.length ? "" : "No plans found in this text."};
}
function commitImport(pv){
  const made = {};
  pv.newEx.forEach(n => {
    const it = pv.plans.flatMap(p=>p.items).find(i => i.exName===n);
    const c = {id:"c_"+uid(), en:n, pl:n, cs:n, sk:n, cat:"other", type:it ? it.type : "w"};
    S.custom.push(c); made[n] = c.id;
  });
  rebuildEx();
  const names = new Set(S.plans.map(p=>p.name));
  pv.plans.forEach(p => {
    let name = p.name; while(names.has(name)) name += " (imported)"; names.add(name);
    S.plans.push({id:uid(), name, note:p.note, items:p.items.map(i => ({exId: i.exId || made[i.exName], sets:i.sets, reps:i.reps, kg:i.kg, rest:i.rest, note:i.note}))});
  });
  save();
}
let importer = null;
function renderImport(){
  const Lr = $("#layer");
  if(!importer){ Lr.innerHTML = ""; return; }
  const pv = importer.pv;
  let prev = "";
  if(pv){
    if(pv.error) prev = `<div class="empty">${esc(pv.error)}</div>`;
    else prev = pv.plans.map(p => `<div class="item"><strong>${esc(p.name)}</strong>${p.note?`<div class="sub">${esc(p.note)}</div>`:""}<div class="setline" style="margin-top:6px">${p.items.map(i => esc(i.exId ? exMain(getEx(i.exId)) : i.exName) + (i.exId ? "" : `<span class="newtag">new</span>`) + ` <span style="opacity:.75">${esc(i.sets)} × ${esc(i.reps||"?")}</span>`).join("<br>")}</div></div>`).join("")
      + (pv.newEx.length ? `<p class="sub" style="margin:0">Names marked <span class="newtag" style="margin:0">new</span> are not in the exercise list, so they will be added as your own exercises (group: ${esc(catName("other"))}).</p>` : "");
  }
  Lr.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="Import plans"><div class="sheet-h"><div class="spread"><h2>Import plans</h2><button class="btn ghost sm" data-act="impClose">Close</button></div></div>
    <div class="sheet-b stack">
      <p class="sub" style="margin:0">Use a CSV file, separated by commas or semicolons. Columns: plan, plan_note, exercise, sets, reps, kg, rest, note, type. Only <strong>plan</strong> and <strong>exercise</strong> are required. Exercise names work in any of the four languages. Imported plans are added next to your plans; nothing gets replaced.</p>
      <div class="row"><button class="btn" style="flex:1" data-act="impFile">${ico("import")}Choose file</button><button class="btn ghost" style="flex:1" data-act="impExample">${ico("export")}Example file</button></div>
      <input type="file" id="csvFile" accept=".csv,text/csv,text/plain" hidden>
      <label class="f">Or paste the text here<textarea class="t" id="csvText" style="min-height:130px;font-size:.85rem;margin-top:4px">${esc(importer.text)}</textarea></label>
      <button class="btn wide" data-act="impCheck">Check</button>
      ${prev}</div>
    <div class="sheet-f"><button class="btn primary wide" data-act="impGo" ${pv && !pv.error ? "" : "disabled"}>${pv && !pv.error ? `Import ${pv.plans.length} plan${pv.plans.length>1?"s":""}` : "Check the text first"}</button></div></div>`;
  $("#csvText").addEventListener("input", e => { importer.text = e.target.value; });
}

/* ---------- workout helpers ---------- */
function blankSets(n){ return Array.from({length:Math.max(1,n||3)}, () => ({kg:"", reps:"", t:"", done:false})); }
function startWorkout(plan){
  if(S.active){ toast("Finish or discard the current workout first."); view="workout"; sub=null; render(); return; }
  S.active = {id:uid(), planId:plan?plan.id:null, name:plan?(plan.name||"Workout"):"Workout", note:plan?plan.note||"":"", start:Date.now(), restEnd:null, restTotal:0,
    pausedAt:plan?null:Date.now(), waiting:!plan, pausedMs:0, exercises: plan ? plan.items.map(it => ({exId:it.exId, rest:num(it.rest)||null, note:it.note||"", target:{sets:it.sets, reps:it.reps, kg:it.kg}, sets:blankSets(num(it.sets) || (lastSets(it.exId)||[]).length || 3)})) : []};
  save(); view="workout"; sub=null; render(); syncWake(); window.scrollTo(0,0);
}
async function finishWorkout(){
  const A = S.active;
  const done = A.exercises.map(x => {
    const type = getEx(x.exId).type;
    return {exId:x.exId, sets:x.sets.filter(s=>s.done).map(s => type==="t" ? {t:parseTime(s.t)} : {kg:num(s.kg), reps:num(s.reps)})};
  }).filter(x => x.sets.length);
  const open = A.exercises.reduce((a,x)=> a + x.sets.filter(s=>!s.done).length, 0);
  if(!done.length){
    if(await ask("No sets are marked done, so there is nothing to save. Discard this workout?", "Discard", true)){ S.active=null; save(); syncWake(); render(); }
    return;
  }
  if(open && !await ask(`${open} set${open>1?"s are":" is"} not marked done and won't be saved. Finish anyway?`, "Finish")) return;
  const w = {id:A.id, planId:A.planId, name:A.name||"Workout", start:A.start, end:A.start + Math.max(60000, elapsedMs(A)), exercises:done};
  S.history.push(w); S.history.sort((a,b)=>a.start-b.start); S.active=null; save(); syncWake();
  const pr = workoutPRs(w);
  view="history"; sub={k:"hist", id:w.id}; render(); window.scrollTo(0,0);
  toast(pr.list.length ? `Workout saved. New record${pr.list.length>1?"s":""}: ` + pr.list.map(p=>`${exMain(getEx(p.exId))} ${setText(p.s,p.type)}`).join("; ") : "Workout saved");
}
function startTimerNow(A){ if(A && A.waiting){ A.start = Date.now(); A.pausedMs = 0; A.pausedAt = null; A.waiting = false; } }
function promptText(msg, value, hint){
  return new Promise(res => {
    const d = document.createElement("div"); d.className = "modal";
    d.innerHTML = `<div class="box" role="dialog" aria-modal="true"><p style="margin:0 0 10px">${esc(msg)}</p><input class="t" id="ptxt" value="${esc(value)}" inputmode="numeric" style="font-size:1.4rem;text-align:center"><p class="sub" style="margin:8px 0 14px">${esc(hint||"")}</p><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-r="0">Cancel</button><button class="btn primary" data-r="1">Save</button></div></div>`;
    d.addEventListener("click", ev => { const b = ev.target.closest("[data-r]"); if(b || ev.target===d){ ev.stopPropagation(); const v = d.querySelector("#ptxt").value; d.remove(); res(b && b.dataset.r==="1" ? v : null); } });
    $("#layer").appendChild(d); const i = d.querySelector("#ptxt"); i.focus(); i.select();
  });
}
function parseClock(v){
  const parts = String(v||"").trim().split(/[:.,\s]+/).filter(Boolean).map(x=>parseInt(x));
  if(!parts.length || parts.some(x=>!isFinite(x) || x<0)) return null;
  const [h,m,sec] = parts.length>=3 ? parts.slice(-3) : parts.length===2 ? [0,parts[0],parts[1]] : [0,parts[0],0];
  return (h*3600 + m*60 + sec) * 1000;
}
function startRest(sec){ const A = S.active; A.restTotal = sec; A.restEnd = Date.now() + sec*1000; save(); tick(); }

/* ---------- render ---------- */
let navLock = false, lastNavKey = "";
const navKey = () => JSON.stringify({view, sub: sub ? {k:sub.k, id:sub.id, edit:!!sub.edit} : null});
const navState = () => ({view, sub: sub ? clone(sub) : null});
function render(){
  const v = {plans:vPlans, workout:vWorkout, progress:vProgress, history:vHistory, settings:vSettings}[view];
  $("#main").innerHTML = v();
  if(!navLock){ const k = navKey(); if(k!==lastNavKey){ lastNavKey = k; try{ history.pushState(navState(), ""); }catch(e){} } }
  document.querySelectorAll("#tabs button").forEach(b => {
    b.removeAttribute("aria-current");
    if(b.dataset.tab===view) b.setAttribute("aria-current","page");
    b.classList.toggle("live", b.dataset.tab==="workout" && !!S.active);
  });
  tick();
}
function tick(){
  const A = S.active, el = $("#elapsed");
  if(A && el) el.textContent = fmtTime(Math.max(0, elapsedMs(A)/1000));
  const R = $("#rest");
  if(A && A.restEnd){
    const left = (A.restEnd - Date.now())/1000;
    if(left <= 0){ A.restEnd = null; save(); R.innerHTML = ""; alertDone(); toast("Rest is over"); return; }
    const pct = 100 - Math.min(100, left / (A.restTotal||1) * 100);
    if(!R.firstChild) R.innerHTML = `<div class="rest" role="timer" aria-label="Rest timer"><div class="bar"></div><div class="time"></div><button data-act="restAdj" data-v="-15">−15</button><button data-act="restAdj" data-v="15">+15</button><button data-act="restSkip">Skip</button></div>`;
    R.querySelector(".time").textContent = "Rest " + fmtTime(Math.ceil(left));
    R.querySelector(".bar").style.width = pct + "%";
  } else R.innerHTML = "";
}
setInterval(tick, 500);

    case "tgtToPlan": {
      const x=A.exercises[+b.dataset.x], tg=x.target||{};
      const apply = p => { const it = p && p.items.find(i=>i.exId===x.exId); if(!it) return; if(tg.sets!=null && tg.sets!=="") it.sets=tg.sets; if(tg.reps!=null) it.reps=tg.reps; if(tg.kg!=null) it.kg=tg.kg; it.rest = x.rest ? String(x.rest) : ""; };
      apply(S.plans.find(p=>p.id===A.planId)); if(S.draft && S.draft.id===A.planId) apply(S.draft.data);
      save(); toast("Plan updated"); break;
    }
    case "viewPlan": { const id=b.dataset.id; if(S.draft && S.draft.id!==id && !await leaveDraft()) break; if(S.draft && S.draft.id===id) sub={k:"plan", id}; else openDraft(S.plans.find(p=>p.id===id), false); render(); window.scrollTo(0,0); break; }
    case "viewTpl": { if(S.draft && !await leaveDraft()) break; const t=TEMPLATES.find(x=>x.id===b.dataset.id); openDraft({id:uid(), name:t.name, note:t.note, items:tplToItems(t)}, true, t.id); render(); window.scrollTo(0,0); break; }
    case "planMove": case "tplMove": { const i=+b.dataset.i, j=i+(+b.dataset.d); if(a==="planMove"){ const E=S.plans; if(j<0||j>=E.length) break; [E[i],E[j]]=[E[j],E[i]]; } else { const ids=orderedTpl().map(t=>t.id); if(j<0||j>=ids.length) break; [ids[i],ids[j]]=[ids[j],ids[i]]; S.settings.tplOrder=ids; } save(); render(); break; }
    case "planStart": {
      const D=S.draft; if(!D) break; let p=clone(D.data);
      if(!p.items.length){ toast("Add exercises first"); break; }
      if(S.active){ toast("Finish or discard the current workout first."); break; }
      if(isDirty()){
        const r=await askChoice("Save your changes to this plan before starting?", [{v:"save",label:D.fromTpl?"Save as my plan and start":"Save and start",kind:"primary"},{v:"once",label:"Start without saving",kind:"ghost"},{v:"",label:"Cancel",kind:"ghost"}]);
        if(!r) break;
        if(r==="save") commitDraft(); else { S.draft=null; save(); }
        if(r==="once" && D.fromTpl) p.id=D.fromTpl;
      } else { S.draft=null; save(); if(D.fromTpl) p.id=D.fromTpl; }
      sub=null; startWorkout(p); break;
    }
    case "editClock": {
      if(!A) break;
      const v = await promptText("Workout time so far", fmtTime(Math.max(0,elapsedMs(A)/1000)), "Type minutes:seconds or hours:minutes:seconds, e.g. 45:00 or 1:05:30.");
      if(v==null) break;
      const ms = parseClock(v); if(ms==null){ toast("That time was not clear. Try e.g. 45:00"); break; }
      if(A.waiting){ A.waiting=false; A.pausedAt=Date.now(); }
      const ref = A.pausedAt || Date.now(); A.start = ref - (A.pausedMs||0) - ms;
      save(); render(); toast("Time updated"); break;
    }
    case "addSet": { const x=A.exercises[+b.dataset.x], l=x.sets[x.sets.length-1]; x.sets.push({kg:l?l.kg:"", reps:l?l.reps:"", t:l?l.t:"", done:false}); save(); render(); break; }
    case "delSet": A.exercises[+b.dataset.x].sets.pop(); save(); render(); break;
    case "wxUp": case "wxDown": { const i=+b.dataset.x, j=a==="wxUp"?i-1:i+1; [A.exercises[i],A.exercises[j]]=[A.exercises[j],A.exercises[i]]; save(); render(); break; }
    case "reorderOpen": reorderKind=b.dataset.v||"ex"; renderReorder(); break;
    case "reorderClose": reorderKind=null; renderReorder(); render(); break;
    case "roUp": case "roDown": { const i=+b.dataset.i, j=a==="roUp"?i-1:i+1; moveItem(i,j); renderReorder(); break; }
    case "roShuffle": { const E=A.exercises; for(let i=E.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [E[i],E[j]]=[E[j],E[i]]; } save(); renderReorder(); break; }
    case "timerPause": if(A && !A.pausedAt){ A.pausedAt=Date.now(); save(); render(); } break;
    case "timerResume": if(A && A.waiting){ startTimerNow(A); save(); render(); break; } if(A && A.pausedAt){ A.pausedMs=(A.pausedMs||0)+(Date.now()-A.pausedAt); A.pausedAt=null; save(); render(); } break;
    case "wxDel": if(await ask(`Remove ${exMain(getEx(A.exercises[+b.dataset.x].exId))} from this workout?`, "Remove", true)){ A.exercises.splice(+b.dataset.x,1); save(); render(); } break;
    case "finish": finishWorkout(); break;
    case "discard": if(await ask("Discard this workout? Nothing from it will be saved.", "Discard", true)){ S.active=null; save(); syncWake(); render(); } break;
    case "restAdj": if(A && A.restEnd){ A.restEnd += (+b.dataset.v)*1000; A.restTotal = Math.max(1, A.restTotal + (+b.dataset.v)); save(); tick(); } break;
    case "restSkip": if(A){ A.restEnd=null; save(); tick(); } break;
    case "openHist": sub={k:"hist", id:b.dataset.id}; render(); window.scrollTo(0,0); break;
    case "openHistFrom": { const from = sub; view="history"; sub={k:"hist", id:b.dataset.id, from}; render(); window.scrollTo(0,0); break; }
    case "histEdit": sub.edit=true; render(); break;
    case "histDone": closeHistEdit(); sub.edit=false; render(); toast("Changes saved"); break;
    case "hAddSet": { const x=hw.exercises[+b.dataset.x], l=x.sets[x.sets.length-1]||{}; x.sets.push(Object.assign({}, l)); save(); render(); break; }
    case "hDelSet": hw.exercises[+b.dataset.x].sets.splice(+b.dataset.s,1); save(); render(); break;
    case "hDelEx": if(await ask(`Remove ${exMain(getEx(hw.exercises[+b.dataset.x].exId))} from this workout?`, "Remove", true)){ hw.exercises.splice(+b.dataset.x,1); save(); render(); } break;
    case "delHist": if(await ask("Delete this workout from History?", "Delete", true)){ S.history=S.history.filter(w=>w.id!==sub.id); save(); sub=sub.from||null; if(sub && sub.k==="ex") view="progress"; render(); } break;
    case "histToPlan": {
      if(!await leaveDraft()) break;
      const p={id:uid(), name:hw.name, note:"", items:hw.exercises.map(x=>{ const t=getEx(x.exId).type==="t", s=x.sets[0]||{}; return {exId:x.exId, sets:x.sets.length, reps:t?fmtTime(s.t):String(s.reps??""), kg:t?"":(s.kg??""), rest:"", note:""}; })};
      S.plans.push(p); save(); view="plans"; openDraft(p, false); render(); toast("Plan created"); break;
    }
    case "openEx": sub={k:"ex", id:b.dataset.id}; render(); window.scrollTo(0,0); break;
    case "exMetric": sub.m=b.dataset.v; render(); break;
    case "lang": S.settings.lang=b.dataset.v; document.documentElement.lang=b.dataset.v; save(); render(); break;
    case "alt": S.settings.alt=b.dataset.v; save(); render(); break;
    case "theme": S.settings.ap.theme=b.dataset.v; save(); applyAppearance(); render(); break;
    case "resetColors": S.settings.ap.custom={}; save(); applyAppearance(); render(); break;
    case "resetLook": if(await ask("Reset theme, fonts, text size and colours to the defaults?", "Reset")){ const dev=S.settings.ap.dev; S.settings.ap=apDefaults(); S.settings.ap.dev=dev; save(); applyAppearance(); render(); } break;
    case "checkUpdate": { try{ const r = navigator.serviceWorker && await navigator.serviceWorker.getRegistration(); if(r) await r.update(); }catch(e){} toast("Reloading…"); setTimeout(()=>location.reload(), 500); break; }
    case "clearCache": if(await ask("Delete the offline copy of the app? Your plans and workouts stay. The app reloads and saves itself again while online.", "Clear")){
        try{ const ks = await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); const rs = navigator.serviceWorker ? await navigator.serviceWorker.getRegistrations() : []; await Promise.all(rs.map(r=>r.unregister())); }catch(e){}
        location.reload(); }
      break;
    case "export": exportData(); break;
    case "import": $("#importFile").click(); break;
    case "copyBackup": { const ta=$("#backupText"); ta.select(); try{ await navigator.clipboard.writeText(ta.value); toast("Copied"); }catch(e){ toast("Select the text and copy it manually"); } break; }
    case "delCustom": {
      const used = S.plans.some(p=>p.items.some(i=>i.exId===b.dataset.id)) || S.history.some(w=>w.exercises.some(x=>x.exId===b.dataset.id));
      if(await ask(used ? "This exercise is used in plans or History. Delete it anyway? It will show as 'Removed exercise' there." : "Delete this exercise?", "Delete", true)){ S.custom=S.custom.filter(c=>c.id!==b.dataset.id); save(); rebuildEx(); render(); }
      break;
    }
    case "wipe": if(await ask("Erase all plans, history and settings on this device? This cannot be undone.", "Erase", true)){ S=defaults(); save(); rebuildEx(); applyAppearance(); view="plans"; sub=null; render(); } break;
  }
});
function closeHistEdit(){
  const w = sub && S.history.find(x=>x.id===sub.id); if(!w) return;
  w.exercises = w.exercises.filter(x => x.sets.length);
  if(!w.name.trim()) w.name = "Workout";
  S.history.sort((a,b)=>a.start-b.start); save();
}

document.addEventListener("input", ev => {
  const el = ev.target, k = el.dataset.bind; if(!k) return;
  const plan = sub && sub.k==="plan" && S.draft ? S.draft.data : null;
  const hw = sub && sub.k==="hist" ? S.history.find(w=>w.id===sub.id) : null;
  if(k==="planName" && plan) plan.name = el.value;
  else if(k==="planNote" && plan) plan.note = el.value;
  else if(k==="item" && plan) plan.items[+el.dataset.i][el.dataset.f] = el.value;
  else if(k==="wName" && S.active) S.active.name = el.value;
  else if(k==="wStart" && S.active){ const t = fromLocalInput(el.value); if(t && t <= Date.now()){ S.active.start = t; tick(); } }
  else if(k==="tgt" && S.active){ const x = S.active.exercises[+el.dataset.x]; if(el.dataset.f==="rest") x.rest = num(el.value) || null; else { x.target = x.target || {sets:"", reps:"", kg:""}; x.target[el.dataset.f] = el.value; } }
  else if(k==="exNote"){ S.exNotes = S.exNotes || {}; if(el.value.trim()) S.exNotes[el.dataset.id] = el.value; else delete S.exNotes[el.dataset.id]; }
  else if(k==="set" && S.active) S.active.exercises[+el.dataset.x].sets[+el.dataset.s][el.dataset.f] = el.value;
  else if(k==="hName" && hw) hw.name = el.value;
  else if(k==="hStart" && hw){ const t = fromLocalInput(el.value); if(t){ const d = hw.end - hw.start; hw.start = t; hw.end = t + d; } }
  else if(k==="hDur" && hw){ const m = parseInt(el.value); if(m > 0) hw.end = hw.start + m*60000; }
  else if(k==="hSet" && hw){ const s = hw.exercises[+el.dataset.x].sets[+el.dataset.s]; s[el.dataset.f] = el.dataset.f==="t" ? parseTime(el.value) : num(el.value); }
  else if(k==="rest"){ const n=parseInt(el.value); if(n>0) S.settings.rest=n; }
  else if(k==="sound") S.settings.sound = el.checked;
  else if(k==="wake"){ S.settings.wake = el.checked; syncWake(); }
  else if(k==="templates") S.settings.templates = el.checked;
  else if(k==="apFont"){ S.settings.ap.font = el.value; applyAppearance(); }
  else if(k==="apHead"){ S.settings.ap.head = el.value; applyAppearance(); }
  else if(k==="apScale"){ S.settings.ap.scale = +el.value; $("#scaleVal").textContent = el.value+"%"; applyAppearance(); }
  else if(k==="apRadius"){ S.settings.ap.radius = +el.value; $("#radVal").textContent = el.value+"px"; applyAppearance(); }
  else if(k==="apColor"){ S.settings.ap.custom[el.dataset.k] = el.value; applyAppearance(); }
  else if(k==="apDev"){ S.settings.ap.dev = el.checked; save(); render(); return; }
  save();
});

document.addEventListener("change", ev => {
  if(ev.target.dataset && ev.target.dataset.bind==="apColor"){ save(); render(); return; }
  if(ev.target.dataset && ev.target.dataset.bind==="tgt" && ev.target.dataset.f==="sets" && S.active){
    const x = S.active.exercises[+ev.target.dataset.x], n = parseInt(ev.target.value);
    if(n>0 && n<=30){ while(x.sets.length<n){ const l = x.sets[x.sets.length-1]; x.sets.push({kg:l?l.kg:"", reps:l?l.reps:"", t:l?l.t:"", done:false}); } while(x.sets.length>n && !x.sets[x.sets.length-1].done) x.sets.pop(); save(); render(); }
    return;
  }
  if(ev.target.dataset && ev.target.dataset.bind==="tgt"){ save(); render(); return; }
  if(ev.target.id==="csvFile"){
    const f = ev.target.files[0]; if(!f || !importer) return;
    const r = new FileReader(); r.onload = () => { importer.text = String(r.result); importer.pv = previewCSV(importer.text); renderImport(); }; r.readAsText(f); return;
  }
  if(ev.target.id!=="importFile") return;
  const f = ev.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = async () => { await importText(r.result); ev.target.value=""; };
  r.readAsText(f);
});

async function importText(txt){
  let d; try{ d = JSON.parse(txt); }catch(e){ toast("That file is not a valid backup."); return; }
  if(!d || !Array.isArray(d.plans) || !Array.isArray(d.history)){ toast("That file is not a Lifts backup."); return; }
  if(!await ask(`Replace everything on this device with the backup (${d.plans.length} plans, ${d.history.length} workouts)?`, "Replace", true)) return;
  S = hydrate(d); save(); rebuildEx(); applyAppearance(); view="plans"; sub=null; render(); toast("Backup restored");
}

async function saveTextFile(filename, data, mime){
  if(downloads){
    try{ await downloads.save({filename, data}); toast("Saved " + filename); return true; }
    catch(e){ if(e && e.code==="declined") return true; }
  }
  try{
    const url = URL.createObjectURL(new Blob([data], {type:mime}));
    const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000); toast(filename + " saved to Downloads"); return true;
  }catch(e){ toast("Could not save the file on this device."); return false; }
}
async function exportData(){
  const data = JSON.stringify(S, null, 1);
  const filename = `lifts-backup-${new Date().toISOString().slice(0,10)}.json`;
  if(downloads){
    try{ await downloads.save({filename, data}); toast("Backup saved"); return; }
    catch(e){ if(e && e.code==="declined") return; }
  } else {
    try{
      const url = URL.createObjectURL(new Blob([data], {type:"application/json"}));
      const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 4000); toast("Backup saved to Downloads"); return;
    }catch(e){}
  }
  $("#backupBox").innerHTML = `<p class="sub" style="margin:0 0 6px">Copy this text and keep it somewhere safe. To restore, save it as a .json file and use Import.</p>
    <textarea class="t" id="backupText" readonly style="min-height:120px;font-size:.8rem">${esc(data)}</textarea>
    <button class="btn sm" data-act="copyBackup" style="margin-top:8px">Copy</button>`;
}

document.documentElement.lang = S.settings.lang;
applyAppearance();
navLock = true; render(); navLock = false; lastNavKey = navKey();
try{ history.replaceState(navState(), ""); }catch(e){}
window.addEventListener("popstate", async ev => {
  const here = navState();
  const m = document.querySelector("#layer .modal");
  if(m){ m.dispatchEvent(new MouseEvent("click", {bubbles:true})); try{ history.pushState(here, ""); }catch(e){} return; }
  if(picker || reorderKind || importer){ picker = null; reorderKind = null; importer = null; $("#layer").innerHTML = ""; render(); try{ history.pushState(here, ""); }catch(e){} return; }
  const st = ev.state; if(!st || !st.view) return;
  const toSub = st.sub;
  if(sub && sub.k==="plan" && !(toSub && toSub.k==="plan" && toSub.id===sub.id)){
    if(!await leaveDraft()){ try{ history.pushState(here, ""); }catch(e){} return; }
  }
  if(sub && sub.k==="hist" && sub.edit) closeHistEdit();
  view = st.view; sub = toSub;
  if(sub && sub.k==="plan" && !(S.draft && S.draft.id===sub.id)) sub = null;
  navLock = true; render(); navLock = false; lastNavKey = navKey(); window.scrollTo(0,0);
});
syncWake();
if("serviceWorker" in navigator && window.isSecureContext){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
</body>
